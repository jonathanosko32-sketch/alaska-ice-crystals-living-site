<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals — 180K Restore Stage 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b14}#site{border:0;width:100%;height:100%;display:block}.stage-tag{position:fixed;z-index:99999;left:10px;top:10px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:15px;padding:8px 11px;font:700 11px Arial,sans-serif;pointer-events:none;opacity:.92}.zoom-controls{position:fixed;z-index:100000;right:10px;bottom:12px;display:flex;gap:7px}.zoom-controls button{height:52px;min-width:52px;border:3px solid #2e8798;background:#062631;color:#fff;border-radius:16px;font:900 22px Arial,sans-serif;touch-action:manipulation}.zoom-controls .reset{min-width:72px;font-size:11px}</style></head><body><iframe id="site" src="world-v2.html?v=restore-stage1-zoom2"></iframe><div class="stage-tag">SAFE RESTORE — STAGE 1 • 180,000 ACTIVE WORLD</div><div class="zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button class="reset" id="zoomReset">RESET</button><button id="zoomIn" aria-label="Zoom in">+</button></div><script>(()=>{const frame=document.getElementById('site'),zin=document.getElementById('zoomIn'),zout=document.getElementById('zoomOut'),zreset=document.getElementById('zoomReset');let patch=null;function injectScript(d,src){const s=d.createElement('script');s.src=src;d.body.appendChild(s)}function installZoom(d){const win=d.getElementById('worldWindow'),plane=d.getElementById('worldPlane'),pos=d.getElementById('position'),dot=d.getElementById('you');if(!win||!plane)return;const WORLD=45000;let x=15000,y=15000,scale=.48;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function readPosition(){const t=pos?.textContent||'';const m=t.match(/X\s+([\d.-]+)\s+•\s+Y\s+([\d.-]+)/);if(m){x=+m[1];y=+m[2]}}function render(){const pw=plane.offsetWidth*scale,ph=plane.offsetHeight*scale,nx=(x-WORLD/2)/WORLD,ny=(y-WORLD/2)/WORLD;plane.style.transform=`translate(calc(-50% + ${-nx*pw}px),calc(-50% + ${-ny*ph}px)) scale(${scale})`;if(pos)pos.textContent=`X ${Math.round(x)} • Y ${Math.round(y)} • ZOOM ${Math.round(scale*100)}% • WORLD ${WORLD} × ${WORLD}`;if(dot){dot.style.left=x/WORLD*100+'%';dot.style.top=y/WORLD*100+'%'}}function zoom(f){readPosition();scale=clamp(scale*f,.20,5);render()}function reset(){x=15000;y=15000;scale=.48;render()}patch={zoom,reset};d.defaultView.OSKO_STAGE1_ZOOM=patch}function apply(){let d;try{d=frame.contentDocument}catch(e){return}if(!d)return;injectScript(d,'world-expansion-test.js?v=restore-stage1-zoom2');injectScript(d,'restoration-stage-1-mountain-ocean.js?v=restore-stage1-zoom2');const style=d.createElement('style');style.textContent=`#v13rearMountains,#v13frontMountains{display:none!important}.gate-v2{left:88%!important;top:97%!important}.main-lodge{left:86%!important;top:16%!important}.campfire-v2{left:70%!important;top:33%!important}`;d.head.appendChild(style);setTimeout(()=>installZoom(d),250)}frame.addEventListener('load',()=>setTimeout(apply,120));zin.addEventListener('click',()=>patch?.zoom(1.25));zout.addEventListener('click',()=>patch?.zoom(.8));zreset.addEventListener('click',()=>patch?.reset())})();</script></body></html>
