<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>V11 Mountain Planner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e5e3;font-family:Arial,sans-serif}#frame{position:absolute;inset:0;width:100%;height:100%;border:0}.bar{position:fixed;z-index:9999;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;pointer-events:none}.badge,.focus{background:#062631;color:#fff;border:3px solid #2e8798;border-radius:14px;padding:7px 9px;font-size:10px;font-weight:bold}.controls{position:fixed;z-index:9999;right:10px;bottom:12px;display:flex;gap:6px}.controls button{height:48px;min-width:48px;border:3px solid #2e8798;background:#062631;color:#fff;border-radius:15px;font-weight:bold;font-size:20px}.controls .reset{font-size:11px;min-width:72px}.tip{position:fixed;z-index:9998;left:10px;bottom:12px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:14px;padding:8px 10px;font-size:10px}</style></head><body><iframe id="frame" src="alaska-expanded-build-v10-test.html?v=mountainplan1"></iframe><div class="bar"><div class="badge">V11 TEST — MOUNTAIN PLANNER</div><div class="focus">BACK / UPPER LAND</div></div><div class="tip">MOVE / ZOOM<br>RESET = MOUNTAIN AREA</div><div class="controls"><button id="minus">−</button><button class="reset" id="reset">RESET</button><button id="plus">+</button></div><script>(()=>{const frame=document.getElementById('frame'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');const WORLD=2200;let doc,v,w,s=.42,tx=0,ty=0,dragStart=null,pinchStart=null;const pts=new Map();const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function apply(){if(!w)return;w.style.left='0';w.style.top='0';w.style.transformOrigin='0 0';w.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`}function focus(){const vw=frame.clientWidth||innerWidth,vh=frame.clientHeight||innerHeight;s=Math.max(.30,Math.min(.58,vw/1350));const targetX=1180,targetY=520;tx=vw*.52-targetX*s;ty=vh*.42-targetY*s;apply()}function zoomAt(f,cx,cy){const ns=clamp(s*f,.14,2.5),wx=(cx-tx)/s,wy=(cy-ty)/s;tx=cx-wx*ns;ty=cy-wy*ns;s=ns;apply()}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function addGuide(){const old=w.querySelector('#mountain-planning-guide');if(old)old.remove();const e=doc.createElement('div');e.id='mountain-planning-guide';e.style.cssText='position:absolute;left:31%;top:3%;width:52%;height:31%;z-index:40;border:7px dashed #6f5a45;border-radius:60% 35% 55% 40%;background:#d9ccb72b;pointer-events:none;color:#4b4034;font-weight:bold;text-align:center;padding-top:22px;font-size:13px';e.innerHTML='MOUNTAIN RANGE PLANNING AREA<br><small style="font-weight:normal">Start upper-right → sweep left → broad S later → taper toward ocean</small>';w.appendChild(e);const farm=doc.createElement('div');farm.id='farm-planning-guide';farm.style.cssText='position:absolute;left:73%;top:24%;width:250px;height:145px;z-index:41;border:6px dashed #6c7c3e;border-radius:24px;background:#dce8b855;pointer-events:none;color:#445321;font-weight:bold;text-align:center;padding-top:38px;font-size:12px';farm.innerHTML='FARM / RANCH<br><small style="font-weight:normal">a little off the mountains</small>';w.appendChild(farm)}function setup(){doc=frame.contentDocument;v=doc.getElementById('v');w=doc.getElementById('w');if(!v||!w)return;const badge=doc.querySelector('.badge'),tip=doc.querySelector('.tip'),controls=doc.querySelector('.controls');if(badge)badge.style.display='none';if(tip)tip.style.display='none';if(controls)controls.style.display='none';addGuide();v.style.touchAction='none';v.onpointerdown=v.onpointermove=v.onpointerup=v.onpointercancel=null;v.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{v.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)dragStart={x:e.clientX,y:e.clientY,tx,ty};else if(pts.size===2){pinchStart={d:dist(),s,tx,ty,m:mid()};dragStart=null}},{passive:false});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&dragStart){tx=dragStart.tx+e.clientX-dragStart.x;ty=dragStart.ty+e.clientY-dragStart.y;apply()}else if(pts.size===2&&pinchStart){const d=dist();if(!pinchStart.d)return;const m=mid(),ns=clamp(pinchStart.s*(d/pinchStart.d),.14,2.5),wx=(pinchStart.m.x-pinchStart.tx)/pinchStart.s,wy=(pinchStart.m.y-pinchStart.ty)/pinchStart.s;s=ns;tx=m.x-wx*s;ty=m.y-wy*s;apply()}},{passive:false});const end=e=>{pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];dragStart={x:a.x,y:a.y,tx,ty};pinchStart=null}else if(!pts.size){dragStart=null;pinchStart=null}};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);focus()}frame.addEventListener('load',setup);minus.onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);plus.onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);reset.onclick=focus;})();</script></body></html>
