<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals V10 TEST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e5e3;font-family:Arial,sans-serif}#frame{position:absolute;inset:0;width:100%;height:100%;border:0}.badge{position:fixed;z-index:9999;left:10px;top:10px;background:#4b1f1f;color:#fff;border:3px solid #b85b5b;border-radius:14px;padding:7px 10px;font-size:11px;font-weight:bold}.controls{position:fixed;z-index:9999;right:10px;bottom:12px;display:flex;gap:6px}.controls button{height:48px;min-width:48px;border:3px solid #2e8798;background:#062631;color:#fff;border-radius:15px;font-weight:bold;font-size:20px}.controls .reset{font-size:12px;min-width:70px}.tip{position:fixed;z-index:9998;left:10px;bottom:12px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:14px;padding:8px 10px;font-size:11px}@media(max-width:430px){.tip{max-width:145px}}</style></head><body><iframe id="frame" src="alaska-expanded-build-v7.html?v=v10road3"></iframe><div class="badge">V10 TEST — ORIGINAL BASE + NEW PIECES</div><div class="tip">ONE FINGER MOVE<br>TWO FINGERS ZOOM</div><div class="controls"><button id="minus">−</button><button class="reset" id="reset">RESET</button><button id="plus">+</button></div><script>(()=>{const frame=document.getElementById('frame'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');const WORLD=2200;let doc,v,w,s=.3,tx=0,ty=0,dragStart=null,pinchStart=null;const pts=new Map();const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function apply(){w.style.left='0';w.style.top='0';w.style.transformOrigin='0 0';w.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`}function fit(){const vw=frame.clientWidth||innerWidth,vh=frame.clientHeight||innerHeight;s=Math.min(vw/WORLD,vh/WORLD)*.94;tx=(vw-WORLD*s)/2;ty=(vh-WORLD*s)/2;apply()}function zoomAt(f,cx,cy){const ns=clamp(s*f,.12,2.5),wx=(cx-tx)/s,wy=(cy-ty)/s;tx=cx-wx*ns;ty=cy-wy*ns;s=ns;apply()}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function el(cls,css,html=''){const e=doc.createElement('div');e.className='v10 '+cls;e.style.cssText=css;e.innerHTML=html;w.appendChild(e);return e}function rerouteFireRoad(){const roads=doc.querySelector('svg.roads');if(!roads)return;const paths=roads.querySelectorAll('path');if(paths[0])paths[0].style.display='none';if(paths[1])paths[1].style.display='none';const d='M760 1080 C725 1015 700 950 690 890 C680 825 695 765 730 710 C765 655 805 610 830 550 C855 490 867 425 872 355 C877 285 878 220 878 165';const edge=doc.createElementNS('http://www.w3.org/2000/svg','path');edge.setAttribute('d',d);edge.setAttribute('class','re');const core=doc.createElementNS('http://www.w3.org/2000/svg','path');core.setAttribute('d',d);core.setAttribute('class','rc');roads.append(edge,core)}function addVisuals(){w.querySelectorAll('.v10').forEach(e=>e.remove());doc.querySelectorAll('.zone').forEach(e=>e.style.display='none');const gate=doc.querySelector('.gate'),house=doc.querySelector('.house'),shop=doc.querySelector('.shop'),fire=doc.querySelector('.fire'),arrival=doc.querySelector('.arrival');if(gate){gate.style.right='55px';gate.style.top='91%'}if(house){house.style.right='7%';house.style.top='13%'}if(shop){shop.style.right='calc(7% + 263px)';shop.style.top='13%'}if(fire){fire.style.left='64%';fire.style.top='38%'}if(arrival){arrival.style.right='8%';arrival.style.top='80%'}rerouteFireRoad();el('orig','position:absolute;left:13%;top:15%;width:72%;height:68%;border:4px solid #638f92;border-radius:34px;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 5px #ffffff44','<div style="position:absolute;left:15px;top:12px;background:#214f56dd;color:white;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:bold">ORIGINAL DISTRICT — BASE</div>');el('carnival','position:absolute;left:40%;top:83%;width:330px;height:185px;border:6px solid #9b7434;border-radius:28px;background:#f1d486aa;z-index:13;text-align:center;padding-top:20px;font-weight:bold;color:#50380e','<div style="font-size:48px">🎡 🎪</div><div>CARNIVAL / HOLIDAY GROUNDS</div>');el('rodeo','position:absolute;left:57%;top:73%;width:310px;height:190px;border:8px solid #7b5430;border-radius:50%;background:#d9b77f99;z-index:13;text-align:center;padding-top:55px;font-weight:bold;color:#49301c','<div style="font-size:36px">🐎</div>RODEO / EVENT RING');el('ranch','position:absolute;left:56%;top:58%;width:350px;height:220px;border:9px double #70502f;border-radius:18px;background:#c7d9a888;z-index:12;text-align:center;padding-top:48px;font-weight:bold;color:#33481d','<div style="font-size:40px">🐄 🐎</div>RANCH COUNTRY / CORRALS');el('trucks','position:absolute;left:18%;top:62%;width:360px;height:200px;border:7px solid #4d5659;border-radius:20px;background:#aeb6b888;z-index:12;text-align:center;padding-top:40px;font-weight:bold;color:#273034','<div style="font-size:44px">🚛 🚚</div>TRUCK / TRAILER WORK AREA');el('warehouse','position:absolute;left:8%;top:82%;width:280px;height:155px;border:8px solid #545b5e;background:#879194;z-index:13;color:white;text-align:center;padding-top:42px;font-weight:bold;box-shadow:inset 0 24px #677175','STORAGE / WAREHOUSE');el('cold','position:absolute;left:23%;top:85%;width:270px;height:145px;border:8px solid #4b7380;background:#a9d6df;z-index:13;color:#173f4a;text-align:center;padding-top:30px;font-weight:bold;box-shadow:inset 0 26px #79afbd','❄️ COLD STORAGE<br>ICE PLANT');el('radio','position:absolute;left:43%;top:57%;width:220px;height:160px;border:5px solid #496b73;border-radius:18px;background:#c5dfe1aa;z-index:13;text-align:center;padding-top:22px;font-weight:bold;color:#23464d','<div style="font-size:45px">📡</div>SKIE RADIO / COMMUNICATIONS');el('stores','position:absolute;left:69%;top:78%;width:300px;height:170px;border:7px solid #6e4e34;border-radius:16px;background:#d6c0a2aa;z-index:13;text-align:center;padding-top:34px;font-weight:bold;color:#46301f','<div style="font-size:38px">🏪 🛍️</div>STORES / COMMERCIAL AREA');el('animals','position:absolute;left:51%;top:14%;width:300px;height:155px;border:7px solid #6e4d31;border-radius:16px;background:#d9c8a4aa;z-index:12;text-align:center;padding-top:30px;font-weight:bold;color:#4d351f','<div style="font-size:38px">🐕 🐴</div>ANIMAL BARNS / SHELTERS');el('future','position:absolute;right:4%;top:4%;width:260px;height:150px;border:5px dashed #6c979c;border-radius:24px;background:#ffffff55;z-index:8;text-align:center;padding-top:48px;font-weight:bold;color:#31575c','FUTURE EXPANSION')}function setup(){doc=frame.contentDocument;v=doc.getElementById('v');w=doc.getElementById('w');if(!v||!w)return;const hud=doc.getElementById('hud'),tog=doc.getElementById('toggle'),help=doc.getElementById('help');if(hud)hud.style.display='none';if(tog)tog.style.display='none';if(help)help.style.display='none';addVisuals();v.style.touchAction='none';v.onpointerdown=v.onpointermove=v.onpointerup=v.onpointercancel=null;v.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{v.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)dragStart={x:e.clientX,y:e.clientY,tx,ty};else if(pts.size===2){pinchStart={d:dist(),s,tx,ty,m:mid()};dragStart=null}},{passive:false});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&dragStart){tx=dragStart.tx+e.clientX-dragStart.x;ty=dragStart.ty+e.clientY-dragStart.y;apply()}else if(pts.size===2&&pinchStart){const d=dist();if(!pinchStart.d)return;const m=mid(),ns=clamp(pinchStart.s*(d/pinchStart.d),.12,2.5),wx=(pinchStart.m.x-pinchStart.tx)/pinchStart.s,wy=(pinchStart.m.y-pinchStart.ty)/pinchStart.s;s=ns;tx=m.x-wx*s;ty=m.y-wy*s;apply()}},{passive:false});const end=e=>{pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];dragStart={x:a.x,y:a.y,tx,ty};pinchStart=null}else if(!pts.size){dragStart=null;pinchStart=null}};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);fit()}frame.addEventListener('load',setup);minus.onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);plus.onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);reset.onclick=fit;addEventListener('resize',()=>setTimeout(fit,100));})();</script></body></html>
