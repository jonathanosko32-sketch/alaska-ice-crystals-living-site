<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals — Unified 180K World</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#020b14}#site{border:0;width:100%;height:100%;height:100dvh;display:block}.tag{position:fixed;z-index:99999;left:10px;top:10px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:15px;padding:8px 11px;font:700 11px Arial,sans-serif;pointer-events:none}</style></head><body><iframe id="site" src="world-v2.html?v=unified180-18"></iframe><div class="tag">180,000 × 180,000 — UNIFIED WORLD TEST</div><script>(()=>{const f=document.getElementById('site');f.addEventListener('load',()=>setTimeout(()=>{const d=f.contentDocument;if(!d)return;const add=src=>{const s=d.createElement('script');s.src=src;d.body.appendChild(s)};add('world-expansion-test.js?v=unified180-18');setTimeout(()=>add('actual-180k-visible-world.js?v=unified180-18'),80);setTimeout(()=>{const win=d.getElementById('worldWindow');if(!win)return;const clean=win.cloneNode(true);win.parentNode.replaceChild(clean,win);const p=clean.querySelector('#worldPlane')||d.getElementById('worldPlane');const readout=d.getElementById('position');if(!p)return;clean.style.top='62px';clean.style.bottom='42px';clean.style.height='auto';clean.style.touchAction='none';/* 5600 keeps 23% larger than the phone viewport, so the world can still pan at minimum zoom, but is lighter than the old 7600 canvas. */p.style.setProperty('width','5600px','important');p.style.setProperty('height','5600px','important');p.style.backfaceVisibility='hidden';p.style.webkitBackfaceVisibility='hidden';p.style.contain='layout paint style';const pts=new Map();let scale=.23,tx=0,ty=0,drag=null,pinch=null,resumeTimer=0;const SPEED=.95,MIN=.23,MAX=.93,ZOOM_IN_POWER=2.55,ZOOM_OUT_POWER=1.15;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const perf=d.createElement('style');perf.textContent=`#worldPlane.nav-moving *{animation-play-state:paused!important}#upperRearMountains180{display:block!important;visibility:visible!important;opacity:1!important;z-index:3!important}`;d.head.appendChild(perf);function pauseMotion(){p.classList.add('nav-moving');clearTimeout(resumeTimer)}function resumeMotion(){clearTimeout(resumeTimer);resumeTimer=setTimeout(()=>p.classList.remove('nav-moving'),180)}function bound(){const sw=p.offsetWidth*scale,sh=p.offsetHeight*scale,vw=clean.clientWidth,vh=clean.clientHeight;const mx=Math.max(0,(sw-vw)/2),my=Math.max(0,(sh-vh)/2);tx=clamp(tx,-mx,mx);ty=clamp(ty,-my,my)}function render(){bound();p.style.left='50%';p.style.top='50%';p.style.transformOrigin='center';p.style.transform=`translate3d(calc(-50% + ${tx}px),calc(-50% + ${ty}px),0) scale(${scale})`;if(readout){const pw=p.offsetWidth*scale||1,ph=p.offsetHeight*scale||1;const nx=clamp(.5-tx/pw,0,1),ny=clamp(.5-ty/ph,0,1);readout.textContent=`X ${Math.round(nx*180000)} • Y ${Math.round(ny*180000)} • ZOOM ${Math.round(scale*100)}% • WORLD 180000 × 180000`}}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}clean.addEventListener('pointerdown',e=>{e.preventDefault();pauseMotion();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{clean.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};pinch=null}else if(pts.size===2){pinch={d:dist(),s:scale,m:mid(),tx,ty};drag=null}},{passive:false});clean.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&drag){tx=drag.tx+(e.clientX-drag.x)*SPEED;ty=drag.ty+(e.clientY-drag.y)*SPEED;render()}else if(pts.size===2&&pinch){const dd=dist();if(!pinch.d)return;const ratioRaw=dd/pinch.d;const power=ratioRaw<1?ZOOM_OUT_POWER:ZOOM_IN_POWER;const ns=clamp(pinch.s*Math.pow(ratioRaw,power),MIN,MAX);const m=mid(),r=clean.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const wx=(pinch.m.x-cx-pinch.tx)/pinch.s,wy=(pinch.m.y-cy-pinch.ty)/pinch.s;tx=(m.x-cx)-wx*ns;ty=(m.y-cy)-wy*ns;scale=ns;render()}},{passive:false});function end(e){pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];drag={x:a.x,y:a.y,tx,ty};pinch=null}else if(!pts.size){drag=null;pinch=null;resumeMotion()}}clean.addEventListener('pointerup',end);clean.addEventListener('pointercancel',end);d.defaultView.addEventListener('resize',render);/* Add mountains only after the final movable plane exists, so they are a real child of that same plane. */setTimeout(()=>{add('upper-rear-mountains-180k.js?v=unified180-18');setTimeout(render,60)},40);render()},260)},120));})();</script></body></html>
