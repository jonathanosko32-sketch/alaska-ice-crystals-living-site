<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals V8 Phone Viewer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e5e3;overscroll-behavior:none;font-family:Arial,sans-serif}#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#d7e5e3}.controls{position:fixed;z-index:9999;right:12px;bottom:14px;display:flex;gap:8px;align-items:center}.controls button,.info{border:3px solid #2e8798;background:#062631;color:#fff;border-radius:18px;font-weight:bold;box-shadow:0 3px 8px #0004}.controls button{min-width:52px;height:52px;font-size:22px;padding:0 13px}.controls .reset{font-size:14px;min-width:78px}.info{position:fixed;z-index:9999;right:12px;top:12px;height:46px;padding:0 16px;font-size:14px}.tip{position:fixed;z-index:9998;left:12px;bottom:16px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:16px;padding:9px 12px;font-size:12px;pointer-events:none;opacity:.92}@media(max-width:430px){.tip{max-width:165px}.controls{gap:5px}.controls button{min-width:46px;height:48px}.controls .reset{min-width:68px}}</style></head><body><iframe id="frame" src="alaska-expanded-build-v7.html?v=phone2"></iframe><button class="info" id="info">SHOW INFO</button><div class="tip">ONE FINGER: MOVE<br>TWO FINGERS: ZOOM</div><div class="controls"><button id="minus">−</button><button class="reset" id="reset">RESET</button><button id="plus">+</button></div><script>(()=>{const frame=document.getElementById('frame'),info=document.getElementById('info'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');let doc,v,w,hud,oldToggle,oldHelp;const WORLD=2200;let s=.3,tx=0,ty=0;const pts=new Map();let dragStart=null,pinchStart=null,infoOn=false;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function apply(){if(!w)return;w.style.left='0';w.style.top='0';w.style.transformOrigin='0 0';w.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`;w.style.willChange='transform'}function fit(){const vw=frame.clientWidth||innerWidth,vh=frame.clientHeight||innerHeight;s=Math.min(vw/WORLD,vh/WORLD)*.94;tx=(vw-WORLD*s)/2;ty=(vh-WORLD*s)/2;apply()}function zoomAt(f,cx,cy){const ns=clamp(s*f,.12,2.4);const wx=(cx-tx)/s,wy=(cy-ty)/s;tx=cx-wx*ns;ty=cy-wy*ns;s=ns;apply()}function distance(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function midpoint(){const a=[...pts.values()];return a.length<2?{x:0,y:0}:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function setup(){doc=frame.contentDocument;v=doc.getElementById('v');w=doc.getElementById('w');hud=doc.getElementById('hud');oldToggle=doc.getElementById('toggle');oldHelp=doc.getElementById('help');if(!v||!w)return;if(hud)hud.style.display='none';if(oldToggle)oldToggle.style.display='none';if(oldHelp)oldHelp.style.display='none';doc.documentElement.style.overscrollBehavior='none';doc.body.style.overscrollBehavior='none';v.style.touchAction='none';v.onpointerdown=null;v.onpointermove=null;v.onpointerup=null;v.onpointercancel=null;v.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{v.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1){dragStart={x:e.clientX,y:e.clientY,tx,ty}}else if(pts.size===2){pinchStart={d:distance(),s,tx,ty,mid:midpoint()};dragStart=null}},{passive:false});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&dragStart){tx=dragStart.tx+(e.clientX-dragStart.x);ty=dragStart.ty+(e.clientY-dragStart.y);apply()}else if(pts.size===2&&pinchStart){const d=distance();if(!pinchStart.d)return;const m=midpoint();const ns=clamp(pinchStart.s*(d/pinchStart.d),.12,2.4);const wx=(pinchStart.mid.x-pinchStart.tx)/pinchStart.s,wy=(pinchStart.mid.y-pinchStart.ty)/pinchStart.s;s=ns;tx=m.x-wx*s;ty=m.y-wy*s;apply()}},{passive:false});const end=e=>{pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];dragStart={x:a.x,y:a.y,tx,ty};pinchStart=null}else if(pts.size===0){dragStart=null;pinchStart=null}};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);fit()}frame.addEventListener('load',setup);minus.addEventListener('click',()=>zoomAt(.8,innerWidth/2,innerHeight/2));plus.addEventListener('click',()=>zoomAt(1.25,innerWidth/2,innerHeight/2));reset.addEventListener('click',fit);info.addEventListener('click',()=>{infoOn=!infoOn;if(hud)hud.style.display=infoOn?'block':'none';info.textContent=infoOn?'HIDE INFO':'SHOW INFO'});addEventListener('resize',()=>setTimeout(fit,100));})();</script></body></html>
