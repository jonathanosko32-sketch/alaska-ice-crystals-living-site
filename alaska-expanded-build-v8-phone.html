<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals V8 Phone Viewer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e5e3;overscroll-behavior:none;font-family:Arial,sans-serif}#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#d7e5e3}.controls{position:fixed;z-index:9999;right:12px;bottom:14px;display:flex;gap:8px;align-items:center}.controls button,.info{border:3px solid #2e8798;background:#062631;color:#fff;border-radius:18px;font-weight:bold;box-shadow:0 3px 8px #0004}.controls button{min-width:52px;height:52px;font-size:22px;padding:0 13px}.controls .reset{font-size:14px;min-width:78px}.info{position:fixed;z-index:9999;right:12px;top:12px;height:46px;padding:0 16px;font-size:14px}.tip{position:fixed;z-index:9998;left:12px;bottom:16px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:16px;padding:9px 12px;font-size:12px;pointer-events:none;opacity:.92}@media(max-width:430px){.tip{max-width:165px}.controls{gap:5px}.controls button{min-width:46px;height:48px}.controls .reset{min-width:68px}}</style></head><body><iframe id="frame" src="alaska-expanded-build-v7.html?v=phone4"></iframe><button class="info" id="info">SHOW INFO</button><div class="tip">ONE FINGER: MOVE<br>TWO FINGERS: ZOOM</div><div class="controls"><button id="minus">−</button><button class="reset" id="reset">RESET</button><button id="plus">+</button></div><script>(()=>{const frame=document.getElementById('frame'),info=document.getElementById('info'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');let doc,v,w,hud,oldToggle,oldHelp,gate;const WORLD=2200;let s=.3,tx=0,ty=0;const pts=new Map();let dragStart=null,pinchStart=null,infoOn=false;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function apply(){if(!w)return;w.style.left='0';w.style.top='0';w.style.transformOrigin='0 0';w.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`;w.style.willChange='transform'}function fit(){const vw=frame.clientWidth||innerWidth,vh=frame.clientHeight||innerHeight;s=Math.min(vw/WORLD,vh/WORLD)*.94;tx=(vw-WORLD*s)/2;ty=(vh-WORLD*s)/2;apply()}function zoomAt(f,cx,cy){const ns=clamp(s*f,.12,2.4);const wx=(cx-tx)/s,wy=(cy-ty)/s;tx=cx-wx*ns;ty=cy-wy*ns;s=ns;apply()}function distance(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function midpoint(){const a=[...pts.values()];return a.length<2?{x:0,y:0}:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function addEntrancePieces(){if(!w||!gate)return;w.querySelectorAll('.entrance-added').forEach(e=>e.remove());const arrival=doc.querySelector('.arrival'),house=doc.querySelector('.house');if(!arrival)return;const add=(tag,styles,text='')=>{const e=doc.createElement(tag);e.className='entrance-added';Object.assign(e.style,styles);if(text)e.textContent=text;w.appendChild(e);return e};const center=e=>({x:e.offsetLeft+e.offsetWidth/2,y:e.offsetTop+e.offsetHeight/2});const line=(a,b,label)=>{const A=center(a),B=center(b),dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;const r=add('div',{position:'absolute',left:A.x+'px',top:(A.y-15)+'px',width:len+'px',height:'30px',background:'#3f474a',border:'7px solid #747f82',borderRadius:'20px',transformOrigin:'0 50%',transform:`rotate(${ang}deg)`,zIndex:'8'});if(label){const lab=add('div',{position:'absolute',left:((A.x+B.x)/2-58)+'px',top:((A.y+B.y)/2-20)+'px',width:'116px',padding:'5px 6px',background:'#163d45dd',border:'3px solid #2e8798',borderRadius:'11px',color:'#fff',fontSize:'11px',fontWeight:'bold',textAlign:'center',zIndex:'14'},label)}return r};line(gate,arrival,'ENTRY ROAD');const ax=arrival.offsetLeft,ay=arrival.offsetTop,aw=arrival.offsetWidth,ah=arrival.offsetHeight;add('div',{position:'absolute',left:(ax-205)+'px',top:(ay+18)+'px',width:'170px',height:'118px',background:'repeating-linear-gradient(90deg,#68777a 0 8px,#455054 8px 28px)',border:'7px solid #3f474a',borderRadius:'15px',zIndex:'7'});add('div',{position:'absolute',left:(ax-204)+'px',top:(ay-18)+'px',width:'168px',padding:'5px',background:'#163d45dd',border:'3px solid #2e8798',borderRadius:'10px',color:'#fff',fontSize:'11px',fontWeight:'bold',textAlign:'center',zIndex:'14'},'VISITOR / ARRIVAL PARKING');add('div',{position:'absolute',left:(ax-20)+'px',top:(ay+ah+18)+'px',width:(aw+40)+'px',height:'68px',background:'#a6d7d0aa',border:'5px solid #5f9fa2',borderRadius:'28px',zIndex:'6'});add('div',{position:'absolute',left:(ax+24)+'px',top:(ay+ah+36)+'px',width:(aw-8)+'px',color:'#173f45',fontSize:'12px',fontWeight:'bold',textAlign:'center',zIndex:'15'},'WELCOME / STARTING PLAZA');if(house)line(arrival,house,'STARTING ROUTE')}function setup(){doc=frame.contentDocument;v=doc.getElementById('v');w=doc.getElementById('w');hud=doc.getElementById('hud');oldToggle=doc.getElementById('toggle');oldHelp=doc.getElementById('help');gate=doc.querySelector('.gate');if(!v||!w)return;if(gate){gate.style.right='55px';gate.style.top='79%'}addEntrancePieces();if(hud)hud.style.display='none';if(oldToggle)oldToggle.style.display='none';if(oldHelp)oldHelp.style.display='none';doc.documentElement.style.overscrollBehavior='none';doc.body.style.overscrollBehavior='none';v.style.touchAction='none';v.onpointerdown=null;v.onpointermove=null;v.onpointerup=null;v.onpointercancel=null;v.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{v.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1){dragStart={x:e.clientX,y:e.clientY,tx,ty}}else if(pts.size===2){pinchStart={d:distance(),s,tx,ty,mid:midpoint()};dragStart=null}},{passive:false});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&dragStart){tx=dragStart.tx+(e.clientX-dragStart.x);ty=dragStart.ty+(e.clientY-dragStart.y);apply()}else if(pts.size===2&&pinchStart){const d=distance();if(!pinchStart.d)return;const m=midpoint();const ns=clamp(pinchStart.s*(d/pinchStart.d),.12,2.4);const wx=(pinchStart.mid.x-pinchStart.tx)/pinchStart.s,wy=(pinchStart.mid.y-pinchStart.ty)/pinchStart.s;s=ns;tx=m.x-wx*s;ty=m.y-wy*s;apply()}},{passive:false});const end=e=>{pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];dragStart={x:a.x,y:a.y,tx,ty};pinchStart=null}else if(pts.size===0){dragStart=null;pinchStart=null}};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);fit()}frame.addEventListener('load',setup);minus.addEventListener('click',()=>zoomAt(.8,innerWidth/2,innerHeight/2));plus.addEventListener('click',()=>zoomAt(1.25,innerWidth/2,innerHeight/2));reset.addEventListener('click',fit);info.addEventListener('click',()=>{infoOn=!infoOn;if(hud)hud.style.display=infoOn?'block':'none';info.textContent=infoOn?'HIDE INFO':'SHOW INFO'});addEventListener('resize',()=>setTimeout(fit,100));})();</script></body></html>
