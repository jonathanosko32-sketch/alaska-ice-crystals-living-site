<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03111f" />
  <title>Alaska Ice Crystals — Living Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="world" id="world" aria-label="Alaska Ice Crystals living website">
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="snow" aria-hidden="true"></div>

    <section class="entrance" id="entrance">
      <p class="eyebrow">ALASKA ICE CRYSTALS</p>
      <h1>Living World</h1>
      <p class="intro">Built from the ground up. The protected foundation is live.</p>

      <button class="crystal-button" id="enterButton" type="button">
        <span class="crystal-mark" aria-hidden="true">✦</span>
        <span>Enter the Property</span>
      </button>
    </section>

    <section class="property" id="property" hidden aria-label="Gate approach">
      <div class="property-hud">
        <span class="hud-kicker">GATE APPROACH</span>
        <strong>Alaska Ice Crystals</strong>
        <span class="hud-note">Living property foundation</span>
      </div>

      <div class="horizon" aria-hidden="true">
        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>
      </div>

      <div class="gate-frame" aria-hidden="true">
        <div class="gate-post left"></div>
        <div class="gate-post right"></div>
        <div class="gate-beam"></div>
        <div class="gate-sign">ALASKA ICE CRYSTALS</div>
      </div>

      <div class="road" aria-hidden="true"></div>

      <button class="world-node node-skie" data-place="SKIE 27" type="button">
        <span class="node-dot"></span>
        <span>SKIE 27</span>
      </button>

      <button class="world-node node-hq" data-place="Headquarters" type="button">
        <span class="node-dot"></span>
        <span>Headquarters</span>
      </button>

      <button class="world-node node-aurora" data-place="Aurora" type="button">
        <span class="node-dot"></span>
        <span>Aurora</span>
      </button>

      <button class="world-node node-workshop" data-place="Workshop" type="button">
        <span class="node-dot"></span>
        <span>Workshop</span>
      </button>

      <div class="interaction-panel" id="interactionPanel" hidden>
        <strong id="interactionTitle">Property node</strong>
        <span id="interactionText">This location is ready for its approved OSKO asset.</span>
      </div>

      <button class="back-button" id="backButton" type="button">Back to Entrance</button>
    </section>

    <footer class="build-stamp">AIC Living Site • v0.2.0</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
