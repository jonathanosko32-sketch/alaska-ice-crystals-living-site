<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03111f" />
  <title>Alaska Ice Crystals — Living Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="world" id="world" aria-label="Alaska Ice Crystals living website entrance">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="stars" aria-hidden="true"></div>

    <section class="entrance" id="entrance">
      <p class="eyebrow">ALASKA ICE CRYSTALS</p>
      <h1>Living World</h1>
      <p class="intro">Built from the ground up. This is the protected first working foundation.</p>

      <button class="crystal-button" id="enterButton" type="button" aria-expanded="false">
        <span class="crystal-mark" aria-hidden="true">✦</span>
        <span>Enter the Property</span>
      </button>

      <div class="status-panel" id="statusPanel" hidden>
        <strong>Foundation is alive.</strong>
        <span>Next we add the approved gate scene piece by piece.</span>
      </div>
    </section>

    <footer class="build-stamp">AIC Living Site • Foundation v0.1.0</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
