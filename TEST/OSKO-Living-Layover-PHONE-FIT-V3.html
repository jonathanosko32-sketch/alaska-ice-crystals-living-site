<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OSKO Living Layover — Phone Fit V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh}header{z-index:5;background:linear-gradient(#06101d,#02070d);border-bottom:1px solid #17334a;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;text-align:center}header .a{font-size:17px;font-weight:800;letter-spacing:.5px}header .b{font-size:11px;opacity:.9;margin-top:3px;letter-spacing:.35px}#stage{position:relative;min-height:0;overflow:hidden;background:#000;touch-action:none}#world{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:640/427;transform-origin:center center;will-change:transform;user-select:none}#world img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}.hot{position:absolute;transform:translate(-50%,-50%);padding:3px 7px;border:1px solid rgba(102,236,255,.9);border-radius:4px;background:rgba(0,20,32,.68);color:#66ecff;font-size:10px;font-weight:800;letter-spacing:.35px;white-space:nowrap;text-shadow:0 1px 2px #000}footer{z-index:5;background:linear-gradient(#050b11,#010306);border-top:1px solid #17334a;padding:7px 6px calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:1.35fr .72fr 1.1fr .72fr .9fr .9fr;gap:5px}footer button{min-width:0;height:42px;border:1px solid #2f657e;border-radius:7px;background:#0b1721;color:#fff;font-weight:800;font-size:11px}footer button:active{background:#173248}
</style>
</head>
<body>
<header><div class="a">WELCOME HOME • OSKO</div><div class="b">ALASKA ICE CRYSTALS • LIVING LAYOVER</div></header>
<main id="stage"><div id="world">
<img src="https://jonathanosko32-sketch.github.io/alaska-ice-crystals-living-site/TEST/v157-student1-winter-traction-black-ice-knowledge-lab.html" alt="Living Layover yard" style="display:none">
<div id="yard" style="position:absolute;inset:0;background:url('https://raw.githubusercontent.com/jonathanosko32-sketch/alaska-ice-crystals-living-site/main/PERMANENT_BASE/layover_background.jpg') center/100% 100% no-repeat"></div>
<div class="hot" style="left:12%;top:24%">ANIMALS</div><div class="hot" style="left:14%;top:35%">LAKE</div><div class="hot" style="left:15%;top:48%">TRUCK</div><div class="hot" style="left:48%;top:43%">HQ</div><div class="hot" style="left:51%;top:54%">CB</div><div class="hot" style="left:78%;top:42%">TOWER</div><div class="hot" style="left:80%;top:27%">EAGLE</div><div class="hot" style="left:80%;top:56%">WORKSHOP</div><div class="hot" style="left:24%;top:62%">AURORA</div><div class="hot" style="left:54%;top:82%">GATE</div>
</div></main>
<footer><button>APPS</button><button id="minus">−</button><button id="reset">RESET</button><button id="plus">+</button><button>LIFE</button><button id="lock">LOCK</button></footer>
<script>
const stage=document.getElementById('stage'),world=document.getElementById('world');const R=427/640,MIN=1,MAX=8;let scale=1,tx=0,ty=0,locked=false,baseH=0,touchMode=null,startTouches=[],startScale=1,startTx=0,startTy=0;
function size(){const r=stage.getBoundingClientRect();world.style.width=r.width+'px';baseH=r.width*R;world.style.height=baseH+'px'}function fit(){const r=stage.getBoundingClientRect();return Math.max(1,r.height/baseH)}function apply(){world.style.transform=`translate(-50%,-50%) translate3d(${tx}px,${ty}px,0) scale(${scale})`}function reset(){size();scale=Math.min(MAX,fit());tx=0;ty=0;apply()}function clamp(v){return Math.max(MIN,Math.min(MAX,v))}function dist(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}function center(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
stage.addEventListener('touchstart',e=>{if(locked)return;e.preventDefault();if(e.touches.length===1){touchMode='pan';startTouches=[{x:e.touches[0].clientX,y:e.touches[0].clientY}];startTx=tx;startTy=ty}else if(e.touches.length>=2){touchMode='pinch';startTouches=[{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY},{clientX:e.touches[1].clientX,clientY:e.touches[1].clientY}];startScale=scale;startTx=tx;startTy=ty}},{passive:false});
stage.addEventListener('touchmove',e=>{if(locked)return;e.preventDefault();if(touchMode==='pan'&&e.touches.length===1){tx=startTx+(e.touches[0].clientX-startTouches[0].x);ty=startTy+(e.touches[0].clientY-startTouches[0].y);apply()}else if(e.touches.length>=2){const a={clientX:e.touches[0].clientX,clientY:e.touches[0].clientY},b={clientX:e.touches[1].clientX,clientY:e.touches[1].clientY};const oldD=Math.max(1,dist(startTouches[0],startTouches[1])),newD=Math.max(1,dist(a,b));scale=clamp(startScale*(newD/oldD));const oc=center(startTouches[0],startTouches[1]),nc=center(a,b);tx=startTx+(nc.x-oc.x);ty=startTy+(nc.y-oc.y);apply()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length===0)touchMode=null;else if(e.touches.length===1){touchMode='pan';startTouches=[{x:e.touches[0].clientX,y:e.touches[0].clientY}];startTx=tx;startTy=ty}},{passive:false});
document.getElementById('plus').onclick=()=>{if(!locked){scale=clamp(scale+.35);apply()}};document.getElementById('minus').onclick=()=>{if(!locked){scale=clamp(scale-.35);apply()}};document.getElementById('reset').onclick=()=>{if(!locked)reset()};document.getElementById('lock').onclick=e=>{locked=!locked;e.currentTarget.textContent=locked?'UNLOCK':'LOCK'};window.addEventListener('resize',reset);window.addEventListener('orientationchange',()=>setTimeout(reset,150));requestAnimationFrame(reset);
</script>
</body></html>
