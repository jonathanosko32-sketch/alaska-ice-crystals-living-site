<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alaska Ice Crystals V56 360 View</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d}#base{width:100vw;height:100vh;border:0}#status{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;text-align:center;pointer-events:none}#status span{display:inline-block;padding:10px 14px;border-radius:15px;background:#061b25ee;border:1px solid #69cbd7;color:#fff;font:800 12px system-ui}#rot{position:fixed;right:12px;top:185px;z-index:10000;display:flex;flex-direction:column;gap:7px}#rot button{width:48px;height:48px;border-radius:14px;border:1px solid #69cbd7;background:#061b25ee;color:#fff;font:900 20px system-ui;box-shadow:0 8px 18px rgba(0,0,0,.28)}#rot .reset{font-size:9px}</style></head><body><iframe id="base" src="v55-carnival-detail-pass.html?v=56"></iframe><div id="rot"><button id="ccw" aria-label="Rotate left">↺</button><button id="cw" aria-label="Rotate right">↻</button><button id="reset" class="reset">RESET</button></div><div id="status"><span>V56 • 360° VIEW • PINCH ZOOM + DRAG + TWO-FINGER TWIST</span></div><script>(()=>{const root=document.getElementById('base');let installed=false,angle=0;function deep(){let d;try{d=root.contentDocument}catch(e){return null}for(let i=0;i<18&&d;i++){const w=d.getElementById('worldWindow');if(w)return {d,w};const f=d.getElementById('base');if(!f)break;try{d=f.contentDocument}catch(e){break}}return null}function apply(w){w.style.transformOrigin='50% 50%';w.style.transform=`rotate(${angle}deg)`;w.style.transition='transform .12s ease-out'}function install(){if(installed)return;const x=deep();if(!x)return setTimeout(install,350);installed=true;const {d,w}=x;apply(w);const hud=d.querySelector('.hud .card:first-child');if(hud)hud.innerHTML='<strong>LIVING WORLD V56</strong>360° view enabled • drag + pinch zoom + two-finger twist';const stamp=d.querySelector('.stamp');if(stamp)stamp.textContent='220,000 × 220,000 • V52 CORE + V55 CARNIVAL PRESERVED • 360° VIEW ADDED WITHOUT REDRAWING WORLD • TEST';const pts=new Map();let startTwist=null,startAngle=0;const twist=()=>{if(pts.size<2)return null;const a=[...pts.values()];return Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)*180/Math.PI};w.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){startTwist=twist();startAngle=angle}},{capture:true});w.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2&&startTwist!==null){let delta=twist()-startTwist;if(delta>180)delta-=360;if(delta<-180)delta+=360;angle=startAngle+delta;apply(w)}},{capture:true});const end=e=>{pts.delete(e.pointerId);if(pts.size<2)startTwist=null};w.addEventListener('pointerup',end,{capture:true});w.addEventListener('pointercancel',end,{capture:true});document.getElementById('ccw').addEventListener('click',()=>{angle-=15;apply(w)});document.getElementById('cw').addEventListener('click',()=>{angle+=15;apply(w)});document.getElementById('reset').addEventListener('click',()=>{angle=0;apply(w)})}root.addEventListener('load',()=>setTimeout(install,3200));setTimeout(install,4200);setInterval(()=>{if(!installed)install()},1000)})();</script></body></html>
