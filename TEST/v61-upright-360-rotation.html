<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alaska Ice Crystals V61</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d}#base{width:100vw;height:100vh;border:0}#status{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;text-align:center;pointer-events:none}#status span{display:inline-block;padding:10px 14px;border-radius:15px;background:#061b25ee;border:1px solid #69cbd7;color:#fff;font:800 12px system-ui}</style></head><body><iframe id="base" src="v60-carnival-all-buildings-open.html?v=61"></iframe><div id="status"><span>V61 • 360 TURN • BUILDINGS + LABELS STAY FACING YOU • V60 PRESERVED</span></div><script>(()=>{const outer=document.getElementById('base');let installed=false,angle=0;function chain(){let d;try{d=outer.contentDocument}catch(e){return null}let rotDoc=null,worldDoc=null,w=null;for(let i=0;i<28&&d;i++){if(d.getElementById('ccw')&&d.getElementById('cw'))rotDoc=d;if(d.getElementById('worldWindow')){worldDoc=d;w=d.getElementById('worldWindow')}const f=d.getElementById('base');if(!f)break;try{d=f.contentDocument}catch(e){break}}return rotDoc&&worldDoc&&w?{rotDoc,worldDoc,w}:null}function faceViewer(worldDoc){const sels=['.v53title','.ride span','.booth','.v58b','.v59b','.v59cell','.v60open','.stamp','.property-label','.building-label','.road-label','.lake-label','.sign','.label'];const els=[...new Set(sels.flatMap(s=>[...worldDoc.querySelectorAll(s)]))];els.forEach(el=>{el.style.transformOrigin='50% 50%';el.style.rotate=(-angle)+'deg';el.style.backfaceVisibility='visible'});const carnival=worldDoc.querySelector('.v53c');if(carnival)carnival.style.setProperty('--view-angle',angle+'deg')}function apply(x){x.w.style.transformOrigin='50% 50%';x.w.style.transform=`rotate(${angle}deg)`;x.w.style.transition='transform .12s ease-out';faceViewer(x.worldDoc)}function install(){if(installed)return;const x=chain();if(!x)return setTimeout(install,350);installed=true;const {rotDoc}=x;const ccw=rotDoc.getElementById('ccw'),cw=rotDoc.getElementById('cw'),reset=rotDoc.getElementById('reset');if(ccw){ccw.replaceWith(ccw.cloneNode(true))}if(cw){cw.replaceWith(cw.cloneNode(true))}if(reset){reset.replaceWith(reset.cloneNode(true))}const nccw=rotDoc.getElementById('ccw'),ncw=rotDoc.getElementById('cw'),nreset=rotDoc.getElementById('reset');nccw&&nccw.addEventListener('click',()=>{angle=(angle-15)%360;apply(x)});ncw&&ncw.addEventListener('click',()=>{angle=(angle+15)%360;apply(x)});nreset&&nreset.addEventListener('click',()=>{angle=0;apply(x)});apply(x);const hud=x.worldDoc.querySelector('.hud .card:first-child');if(hud)hud.innerHTML='<strong>LIVING WORLD V61</strong>360 turn • buildings and labels stay facing viewer';const stamp=x.worldDoc.querySelector('.stamp');if(stamp)stamp.textContent='V61 • V60 PRESERVED • 360 BUTTON TURN • VIEWER-FACING BUILDINGS/LABELS • PINCH + DRAG UNCHANGED • TEST'}outer.addEventListener('load',()=>setTimeout(install,4200));setTimeout(install,5200);setInterval(()=>{if(!installed)install()},1000)})();</script></body></html>
