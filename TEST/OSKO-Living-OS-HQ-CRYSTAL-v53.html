:root{--ice:#98e8ff;--line:rgba(152,232,255,.38);--txt:#eefcff;--muted:#9ab6c2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020910;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}#app{position:fixed;inset:0;overflow:hidden;background:#020910}#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#topbar{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));height:52px;display:flex;align-items:center;justify-content:space-between;gap:7px;pointer-events:none}.brand{min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:16px;background:rgba(4,15,24,.72);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.08)}.brand b{display:block;font-size:12px;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;font-size:8px;letter-spacing:.11em;color:var(--muted);margin-top:2px}#clock{font-variant-numeric:tabular-nums;white-space:nowrap;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(3,14,22,.7);backdrop-filter:blur(14px);font-size:10px;letter-spacing:.06em}#status{position:absolute;top:70px;left:50%;transform:translateX(-50%);pointer-events:none;max-width:88vw;padding:6px 10px;border-radius:999px;border:1px solid rgba(152,232,255,.28);background:rgba(2,13,21,.62);backdrop-filter:blur(9px);font-size:9px;letter-spacing:.07em;color:#c9f6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dock{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;border:1px solid var(--line);border-radius:22px;background:rgba(3,13,21,.72);backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.34)}button{appearance:none;border:1px solid rgba(152,232,255,.27);background:linear-gradient(180deg,rgba(23,59,78,.8),rgba(5,20,30,.82));color:#eaffff;border-radius:14px;height:42px;padding:0 10px;font-size:9px;font-weight:800;letter-spacing:.08em}button:active{transform:scale(.96)}#skie{min-width:62px;background:radial-gradient(circle at 50% 30%,rgba(147,236,255,.32),rgba(4,23,35,.9));border-color:rgba(180,244,255,.55)}#panel{position:absolute;left:10px;right:10px;bottom:76px;max-height:36vh;overflow:auto;border:1px solid rgba(152,232,255,.32);border-radius:21px;background:linear-gradient(180deg,rgba(5,18,28,.93),rgba(2,9,15,.91));backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.42);padding:13px 15px;transform:translateY(18px);opacity:0;pointer-events:none;transition:.2s ease}#panel.open{transform:none;opacity:1;pointer-events:auto}#ptype{font-size:8px;letter-spacing:.18em;color:#87dff7}#panel h2{margin:5px 0 6px;font-size:17px}#panel p{margin:0;color:#c0d5de;font-size:11px;line-height:1.45}#actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.chip{height:auto;padding:7px 9px;border-radius:999px;font-size:9px}#voice{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,8,13,.38);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}#voice.on{opacity:1;pointer-events:auto}.orb{width:min(43vw,180px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(179,249,255,.38),rgba(13,91,116,.28) 38%,rgba(0,15,24,.94) 70%);border:1px solid rgba(191,250,255,.7);box-shadow:0 0 70px rgba(87,214,255,.26);font-size:10px;letter-spacing:.14em;font-weight:800}.orb small{display:block;font-size:8px;color:#9cc6d3;margin-top:6px;font-weight:500;letter-spacing:.05em}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#020910;z-index:20;transition:.4s}.loader{text-align:center}.loader b{display:block;font-family:"Segoe Script
