<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OSKO Phone Install + Service Harness v2</title><style>body{margin:0;background:#07111a;color:#eaf8ff;font-family:system-ui,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#0d1c29;border:1px solid #28506b;border-radius:16px;padding:14px;margin:10px 0}.ok{border-color:#2b8b63}.bad{border-color:#a84b4b}.wait{border-color:#806d2d}h1{font-size:22px;margin:0 0 4px}.muted{opacity:.72;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-weight:700}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;margin-top:10px}</style>
<script src="modules/osko-event-bus-v1.js"></script><script src="modules/osko-android-host-core-v1.js"></script><script src="modules/osko-wake-session-core-v1.js"></script><script src="modules/osko-phone-runtime-core-v1.js"></script><script src="modules/osko-phone-install-profile-v1.js"></script><script src="modules/osko-phone-service-supervisor-v1.js"></script></head><body><main><h1>OSKO Living OS</h1><div class="muted">Phone Install + Service Harness v2 — architecture test only</div><div id="summary" class="card wait">Starting tests…</div><div id="tests"></div><button onclick="runAll()">RUN TESTS AGAIN</button><div class="card"><b>Protected baseline</b><div class="muted">V11 and FIX8 are protected. No APK is installed by this page.</div></div></main><script>
(function(){'use strict';
const testsEl=document.getElementById('tests'),summaryEl=document.getElementById('summary');
function card(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'ok':'bad');d.innerHTML='<div class="row"><b>'+name+'</b><span class="tag">'+(ok?'PASS':'FAIL')+'</span></div><div class="muted"></div>';d.querySelector('.muted').textContent=detail||'';testsEl.appendChild(d);return ok;}
function safe(fn){try{return fn();}catch(e){return {__error:String(e&&e.message||e)}}}
window.runAll=function(){testsEl.innerHTML='';let pass=0,total=0;function t(name,fn,detail){total++;const r=safe(fn);const ok=r===true||(r&&r.ok===true);if(ok)pass++;card(name,ok,detail?detail(r):((r&&r.__error)||JSON.stringify(r)));return r;}
const loaded=t('Phone install/service modules loaded',()=>!!(window.OSKOEventBus&&window.OSKOAndroidHost&&window.OSKOWakeSession&&window.OSKOPhoneRuntime&&window.OSKOPhoneInstallProfile&&window.OSKOPhoneServiceSupervisor),r=>r?'All required globals found':'Missing module global');if(loaded!==true){summaryEl.className='card bad';summaryEl.textContent='STOPPED — module load failure';return;}
const bus=OSKOEventBus.create();const host=OSKOAndroidHost.create({eventBus:bus});const wake=OSKOWakeSession.create({eventBus:bus});const runtime=OSKOPhoneRuntime.create({eventBus:bus,androidHost:host,wakeSession:wake});const install=OSKOPhoneInstallProfile.create({eventBus:bus,stableRelease:'V11',recoveryRelease:'FIX8'});const service=OSKOPhoneServiceSupervisor.create({eventBus:bus,phoneRuntime:runtime});
t('Install profile preserves V11 + FIX8 protection',()=>{const s=install.status();return s.protectedReleases.includes('V11')&&s.protectedReleases.includes('FIX8')&&!install.canRemove('V11')&&!install.canRemove('FIX8')},r=>'Protected baselines cannot be removed');
t('Phone install profile initializes',()=>install.install({stableRelease:'V11',dataSchema:1}),r=>'Stable: '+install.status().stableRelease+' · Data boundary: '+install.status().dataBoundary);
const ready=runtime.connectHost({androidVersion:'16',capabilities:['network','storage','audio','microphone','camera']});t('Android host reaches ready state',()=>ready.ok===true,r=>'Android readiness: '+String(runtime.status().host.readiness.ready));
t('Foreground phone uses full visual mode',()=>{const s=service.update({appState:'foreground',screenOn:true,network:'wifi',charging:false,battery:67,thermal:'normal'});return s.visualMode==='full'&&s.canListen===true},r=>'Visual mode: '+service.status().visualMode+' · Wake eligible: '+service.status().canListen);
t('Background mode reduces visual load',()=>service.update({appState:'background',screenOn:false}).visualMode==='reduced',r=>'Visual mode: '+service.status().visualMode);
t('Critical thermal state pauses rendering',()=>{const s=service.update({appState:'foreground',screenOn:true,thermal:'critical'});return s.visualMode==='paused'&&s.shouldRender===false&&s.canListen===false},r=>'Render budget: '+service.renderBudget()+' · Wake eligible: '+service.status().canListen);
t('Normal thermal recovery restores service',()=>{const s=service.update({thermal:'normal',battery:54,charging:false});return s.visualMode==='full'&&s.canListen===true},r=>'Visual mode: '+service.status().visualMode);
t('Candidate can be staged without replacing stable',()=>{const r=install.stageCandidate('V12-test');return r.ok&&install.status().stableRelease==='V11'&&install.status().candidateRelease==='V12-test'},r=>'Stable remains '+install.status().stableRelease+' · Candidate '+install.status().candidateRelease);
t('Activation is blocked before verification/phone approval',()=>install.activateCandidate({verified:true,phoneConfirmed:false,ownerApproved:true}).ok===false,r=>'Unconfirmed candidate cannot become stable');
t('Verified + phone-confirmed + owner-approved candidate activates',()=>install.activateCandidate({verified:true,phoneConfirmed:true,ownerApproved:true}),r=>'Stable is now '+install.status().stableRelease+' · Previous '+install.status().previousRelease);
t('Rollback returns to previous stable release',()=>{const r=install.rollback('simulated failure');return r.ok&&install.status().stableRelease==='V11'},r=>'Rollback stable: '+install.status().stableRelease);
t('Protected release cannot be unprotected without owner confirmation',()=>install.unprotect('V11',{ownerApproved:true,userConfirmed:false})===false,r=>'V11 stays protected');
summaryEl.className='card '+(pass===total?'ok':'bad');summaryEl.innerHTML='<div class="row"><b>Phone architecture result</b><span class="tag">'+pass+' / '+total+' PASS</span></div><div class="muted">Install/update protection and phone service behavior are logical tests only; no APK or privileged Android service is running here.</div>';
};runAll();
})();
</script></body></html>
