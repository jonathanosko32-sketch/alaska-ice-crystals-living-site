<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OSKO Living OS Module Harness v1</title><style>
:root{color-scheme:dark}body{margin:0;background:#07111d;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#0e1d2c;border:1px solid #24425c;border-radius:16px;padding:14px;margin:12px 0}.brand{font-size:25px;font-weight:800}.sub{opacity:.72}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #193247}.row:last-child{border-bottom:0}.ok{color:#8ff7b2}.bad{color:#ffadad}.wait{color:#ffe39b}button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:750;background:#d9f2ff;color:#082033}.small{font-size:13px;opacity:.75}code{word-break:break-all}</style></head><body><main class="wrap"><div class="brand">Alaska Ice Crystals</div><div class="sub">Living OS • isolated module integration harness v1</div><section class="card"><b>Purpose</b><p class="small">Loads modular OS foundations without touching FIX8, Three.js render loops, or physical robot/vehicle controls.</p><button id="run">RUN MODULE CHECK</button></section><section class="card"><b>Core status</b><div id="core"></div></section><section class="card"><b>Runtime smoke test</b><div id="smoke" class="small">Not run yet.</div></section><section class="card"><b>Loaded files</b><div id="files"></div></section></main>
<script src="modules/osko-integration-manifest-v1.js"></script>
<script>
(function(){'use strict';const q=s=>document.querySelector(s);const core=q('#core'),files=q('#files'),smoke=q('#smoke');
function row(name,state,detail){const d=document.createElement('div');d.className='row';d.innerHTML='<span>'+name+'</span><span class="'+(state==='PASS'?'ok':state==='FAIL'?'bad':'wait')+'">'+state+(detail?' • '+detail:'')+'</span>';return d}
function load(src){return new Promise(resolve=>{const s=document.createElement('script');s.src=src+'?h=1';s.onload=()=>resolve({src,ok:true});s.onerror=()=>resolve({src,ok:false});document.head.appendChild(s)})}
async function run(){q('#run').disabled=true;core.innerHTML='';files.innerHTML='';smoke.textContent='Running…';const man=window.OSKOIntegrationManifest;if(!man){core.appendChild(row('integration manifest','FAIL'));return}const items=man.list();for(const m of items){const r=await load(m.path);files.appendChild(row(m.id,r.ok?'PASS':'FAIL',r.ok?'loaded':'load error'))}
const checks=man.verify(window);for(const c of checks){core.appendChild(row(c.global,c.present?'PASS':(c.required?'FAIL':'WAIT'),c.required?'required':'optional'))}
try{if(!window.OSKOEventBus||!window.OSKOWorldState||!window.OSKORuntime)throw new Error('required core unavailable');const eventBus=OSKOEventBus.create({maxHistory:30});const worldState=OSKOWorldState.create();const runtime=OSKORuntime.create({modules:{eventBus,worldState}});runtime.start();runtime.tick(Date.now());worldState.tick(new Date());eventBus.emit('harness:smoke',{ok:true});const st=runtime.status();const hist=eventBus.getHistory();smoke.innerHTML='<span class="ok">PASS</span> • runtime started='+st.started+' • ticks='+st.ticks+' • events='+hist.length+' • world revision='+worldState.snapshot().revision;}catch(err){smoke.innerHTML='<span class="bad">FAIL</span> • '+String(err&&err.message||err)}q('#run').disabled=false}
q('#run').addEventListener('click',run);run();})();
</script></body></html>
