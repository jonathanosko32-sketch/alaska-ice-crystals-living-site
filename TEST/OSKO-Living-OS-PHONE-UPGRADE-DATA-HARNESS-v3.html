<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OSKO Phone Upgrade + Data Harness v3</title><style>body{margin:0;background:#07111a;color:#eaf8ff;font-family:system-ui,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#0d1c29;border:1px solid #28506b;border-radius:16px;padding:14px;margin:10px 0}.ok{border-color:#2b8b63}.bad{border-color:#a84b4b}.wait{border-color:#806d2d}h1{font-size:22px;margin:0 0 4px}.muted{opacity:.72;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-weight:700}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;margin-top:10px}</style>
<script src="modules/osko-event-bus-v1.js"></script><script src="modules/osko-user-data-vault-v1.js"></script><script src="modules/osko-state-migration-v1.js"></script><script src="modules/osko-android-host-core-v1.js"></script><script src="modules/osko-phone-install-profile-v1.js"></script><script src="modules/osko-phone-data-continuity-v1.js"></script><script src="modules/osko-phone-upgrade-orchestrator-v1.js"></script></head><body><main><h1>OSKO Living OS</h1><div class="muted">Phone Upgrade + User Data Continuity Harness v3</div><div id="summary" class="card wait">Starting tests…</div><div id="tests"></div><button onclick="runAll()">RUN TESTS AGAIN</button><div class="card"><b>Protected baseline</b><div class="muted">V11 and FIX8 remain protected. This harness does not install an APK or overwrite either build.</div></div></main><script>
(function(){'use strict';
const testsEl=document.getElementById('tests'),summaryEl=document.getElementById('summary');
function card(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'ok':'bad');d.innerHTML='<div class="row"><b>'+name+'</b><span class="tag">'+(ok?'PASS':'FAIL')+'</span></div><div class="muted"></div>';d.querySelector('.muted').textContent=detail||'';testsEl.appendChild(d);}
function safe(fn){try{return fn();}catch(e){return {__error:String(e&&e.message||e)}}}
window.runAll=function(){testsEl.innerHTML='';let pass=0,total=0;function t(name,fn,detail){total++;const r=safe(fn);const ok=r===true||(r&&r.ok===true);if(ok)pass++;card(name,ok,detail?detail(r):((r&&r.__error)||JSON.stringify(r)));return r;}
const loaded=t('Upgrade modules loaded',()=>!!(window.OSKOEventBus&&window.OSKOUserDataVault&&window.OSKOStateMigration&&window.OSKOAndroidHost&&window.OSKOPhoneInstallProfile&&window.OSKOPhoneDataContinuity&&window.OSKOPhoneUpgradeOrchestrator),r=>r?'All required globals found':'One or more modules missing');if(loaded!==true){summaryEl.className='card bad';summaryEl.textContent='STOPPED — module load failure';return;}
try{localStorage.removeItem('osko.livingos.harness.v3');}catch(_e){}
const bus=OSKOEventBus.create();const vault=OSKOUserDataVault.create({eventBus:bus,storageKey:'osko.livingos.harness.v3',schemaVersion:1});const migration=OSKOStateMigration.create({eventBus:bus,currentSchema:2});migration.register(1,2,function(data){data['system.schema2Ready']=true;return data;},{name:'Harness 1 to 2'});const host=OSKOAndroidHost.create({eventBus:bus});const install=OSKOPhoneInstallProfile.create({eventBus:bus,stableRelease:'V11',recoveryRelease:'FIX8'});const continuity=OSKOPhoneDataContinuity.create({eventBus:bus,vault,migration});const upgrade=OSKOPhoneUpgradeOrchestrator.create({eventBus:bus,installProfile:install,dataContinuity:continuity,androidHost:host});
t('Android host becomes upgrade-ready',()=>{host.connect({version:'16',capabilities:['network','storage','audio','microphone','camera']});return host.readiness().ready},r=>'Required phone capabilities present');
t('Installed profile starts on protected V11',()=>{const x=install.install({stableRelease:'V11',dataSchema:1});return x.ok&&install.status().stableRelease==='V11'&&!install.canRemove('V11')&&!install.canRemove('FIX8')},r=>'V11 stable; V11 and FIX8 protected');
t('User data is stored outside release code',()=>vault.set('preferences','theme','alaska-ice').ok&&vault.get('preferences','theme')==='alaska-ice',r=>'Preference stored in user data vault');
t('V12 upgrade stages with pre-upgrade checkpoint',()=>upgrade.begin({releaseId:'V12',targetSchema:2}),r=>'Checkpoint: '+(r&&r.status&&r.status.checkpointId||'none'));
t('Data migration is previewed before activation',()=>upgrade.prepareData(),r=>'Migration preview completed without replacing current stable release');
t('Candidate can be verified separately',()=>upgrade.markVerified({integrationPassed:true}),r=>'Candidate verified; not active yet');
t('Activation is blocked without phone confirmation',()=>{const r=upgrade.activate({ownerApproved:true,phoneConfirmed:false});return r.ok===false&&r.error==='PHONE_CONFIRMATION_REQUIRED'&&upgrade.status().phase==='verified'},r=>'Blocked attempt leaves candidate in verified state');
t('Owner-approved phone-confirmed activation moves to V12',()=>{const r=upgrade.activate({ownerApproved:true,phoneConfirmed:true});const s=vault.snapshot();return r.ok&&install.status().stableRelease==='V12'&&s.schemaVersion===2&&s.data['preferences.theme']==='alaska-ice'&&s.data['system.schema2Ready']===true},r=>'V12 active; existing user preference preserved through schema migration');
t('Upgrade completes without deleting rollback target',()=>{const r=upgrade.complete({smokeTest:true});return r.ok&&install.status().previousRelease==='V11'},r=>'V11 retained as previous release');
t('Rollback restores V11 and pre-upgrade user data',()=>{const r=upgrade.rollback('HARNESS_ROLLBACK_TEST',{ownerApproved:true});const s=vault.snapshot();return r.ok&&install.status().stableRelease==='V11'&&s.schemaVersion===1&&s.data['preferences.theme']==='alaska-ice'&&!Object.prototype.hasOwnProperty.call(s.data,'system.schema2Ready')},r=>'Stable release and original schema/data restored from checkpoint');
summaryEl.className='card '+(pass===total?'ok':'bad');summaryEl.innerHTML='<div class="row"><b>Upgrade safety result</b><span class="tag">'+pass+' / '+total+' PASS</span></div><div class="muted">Tests staged upgrade, data migration, owner gate, phone confirmation and rollback.</div>';
};runAll();
})();
</script></body></html>
