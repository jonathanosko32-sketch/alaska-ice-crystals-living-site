<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03131d"><title>Alaska Ice Crystals V93 — Digital Safety + PPE Department</title><style>html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#03131d}#base{width:100vw;height:100dvh;border:0;display:block}</style></head><body><iframe id="base" src="v92-commercial-rights-sweep.html?v=93-base"></iframe><script>(()=>{const f=document.getElementById('base');let done=false;function install(){if(done)return;let d;try{d=f.contentDocument}catch(e){return setTimeout(install,350)}if(!d)return setTimeout(install,350);const expansion=d.querySelector('.expansion');if(!expansion)return setTimeout(install,450);done=true;const s=d.createElement('style');s.textContent=`.v93btn{position:absolute;left:5250px;top:12880px;width:1450px;height:380px;z-index:60;border:16px solid #ffe48a;border-radius:46px;background:linear-gradient(135deg,#4b3811,#8a6517);color:#fff;font:1000 29px/1.25 system-ui;box-shadow:0 18px 42px #0006}.v93btn small{display:block;font:800 16px/1.35 system-ui;margin-top:10px;color:#fff5c9}.v93ov{position:fixed;inset:0;z-index:37000;background:#081018fa;color:#fff;font-family:system-ui;display:none;overflow:auto}.v93ov.open{display:block}.v93head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#4b3811;border-bottom:2px solid #ffe48a}.v93head strong{flex:1;color:#fff8d7;font:1000 17px system-ui}.v93head button{border:2px solid #ffe48a;border-radius:14px;background:#6d5115;color:#fff;padding:10px 13px;font:900 13px system-ui}.v93wrap{max-width:1160px;margin:0 auto;padding:16px}.v93intro{border:2px solid #e8c55d;border-radius:18px;background:#3b2d12;padding:14px;margin-bottom:14px;font:800 14px/1.45 system-ui}.v93grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}.v93card{border:2px solid #7ecbe8;border-radius:17px;background:#123247;padding:13px;display:flex;flex-direction:column;min-height:195px}.v93card h3{margin:0 0 7px;font:1000 15px system-ui;color:#eafaff}.v93card p{margin:0 0 10px;font:750 12px/1.42 system-ui;flex:1;color:#f5fbff}.v93tag{display:inline-block;align-self:flex-start;border:1px solid #ffe48a;border-radius:8px;padding:4px 7px;margin-bottom:7px;background:#6b521a;font:900 10px system-ui}.v93shoe{border-color:#ffcf5a;background:#4a3710}.v93test{margin-top:15px;border:2px solid #9fd7a9;border-radius:18px;background:#153623;padding:14px}.v93q{padding:10px 0;border-bottom:1px solid #ffffff22}.v93q:last-child{border-bottom:0}.v93q b{display:block;margin-bottom:7px;font:900 13px system-ui}.v93q label{display:block;margin:5px 0;font:750 12px system-ui}.v93submit{margin-top:12px;border:0;border-radius:12px;background:#dfffe6;color:#133820;padding:11px 14px;font:1000 13px system-ui}.v93score{margin-top:10px;font:900 14px system-ui}.v93note{border:2px solid #d7b76b;border-radius:16px;background:#473d1d;padding:12px;font:800 12px/1.45 system-ui;margin-top:14px}`;d.head.appendChild(s);expansion.insertAdjacentHTML('beforeend',`<button class="v93btn" id="v93open">DIGITAL SAFETY + PPE DEPARTMENT<small>Protective footwear / steel toes • eye + face • head • hearing • hands • respiratory • visibility • fall protection • cold + task-specific PPE • hazard recognition + testing</small></button>`);d.body.insertAdjacentHTML('beforeend',`<div class="v93ov" id="v93ov"><div class="v93head"><strong>ALASKA ICE CRYSTALS — DIGITAL SAFETY + PPE DEPARTMENT</strong><button id="v93close">CLOSE</button></div><div class="v93wrap"><div class="v93intro">Separate school department. Training is built from current official OSHA requirements and Alaska Ice Crystals original digital lessons/tests. Students learn to identify the hazard first, choose the correct PPE, understand limitations, fit/use it correctly, inspect it, maintain it, and demonstrate understanding before practical/simulator work.</div><div class="v93grid"><div class="v93card v93shoe"><span class="v93tag">CORE PPE — PROTECTIVE FOOTWEAR</span><h3>Steel-Toe / Safety-Toe Shoes + Boots</h3><p>Teach impact/compression, falling or rolling objects, sole-puncture hazards, electrical-hazard considerations, proper fit, condition checks, markings/certification, replacement, and job-site rules. Freight-dock, coil/steel, heavy-equipment, mechanic, warehouse and construction scenarios are included. Steel-toe footwear is treated as a major real-world trucking safety item, not a footnote.</p></div><div class="v93card"><span class="v93tag">EYE + FACE</span><h3>Safety Glasses • Goggles • Face Shields</h3><p>Flying particles, grinding, cutting, chemicals/splash, dust and task-specific protection. Students learn when a face shield supplements rather than replaces primary eye protection.</p></div><div class="v93card"><span class="v93tag">HEAD</span><h3>Hard Hats / Head Protection</h3><p>Falling-object, struck-by and electrical-hazard awareness; inspection, fit and replacement. Tie lessons to docks, construction, mechanics and heavy equipment.</p></div><div class="v93card"><span class="v93tag">HANDS</span><h3>Gloves / Hand Protection</h3><p>Cut, abrasion, chemical, heat/cold and task-specific glove selection. Include limitations and machine-entanglement awareness so students do not assume gloves are always appropriate.</p></div><div class="v93card"><span class="v93tag">HEARING</span><h3>Earplugs / Earmuffs</h3><p>Noise exposure, correct fit/use, inspection and when hearing conservation requirements may apply around shops, equipment, aviation and industrial work.</p></div><div class="v93card"><span class="v93tag">RESPIRATORY</span><h3>Respirators / Dust + Vapor Protection</h3><p>Digital awareness training distinguishes simple dust masks from regulated respiratory protection. Medical evaluation, fit testing, cartridge selection and program requirements are flagged for the appropriate regulated training path.</p></div><div class="v93card"><span class="v93tag">VISIBILITY</span><h3>High-Visibility Vests / Garments</h3><p>Truck yards, loading docks, roadside work, warehouses, airports and moving-equipment zones. Students identify blind spots and when conspicuity clothing is part of the site rule or hazard-control plan.</p></div><div class="v93card"><span class="v93tag">FALL + HEIGHT</span><h3>Harnesses / Fall Protection</h3><p>Awareness of fall hazards, inspection, fit, anchor/system concepts and task-specific requirements before a student progresses to work-at-height simulations.</p></div><div class="v93card"><span class="v93tag">COLD / WEATHER</span><h3>Alaska Cold-Weather PPE</h3><p>Layering, insulated gloves/boots, traction, visibility, frostbite/hypothermia awareness and the difference between ordinary weather clothing and PPE required for a specific workplace hazard.</p></div><div class="v93card"><span class="v93tag">SPECIAL TASKS</span><h3>Welding • Chemical • Water • Electrical</h3><p>Dedicated branches for welding protection, chemical-resistant PPE, life-saving equipment near water, and electrical protective equipment. These become prerequisites for related mechanics, construction, agricultural and industrial simulations.</p></div><div class="v93card"><span class="v93tag">HAZARD RECOGNITION</span><h3>Choose PPE From the Hazard</h3><p>Student sees a digital work scene, identifies what can hurt them, selects the required PPE, explains why, and identifies what PPE cannot protect against. The lesson teaches hazard assessment rather than memorizing a shopping list.</p></div><div class="v93card"><span class="v93tag">CROSS-DEPARTMENT</span><h3>Safety Gate Before Simulator Work</h3><p>Relevant PPE/safety modules can be required before trucking, load securement, mechanics, heavy equipment, construction, aviation ground operations, agriculture and other practical simulations unlock.</p></div></div><div class="v93test"><h3 style="margin-top:0">PPE KNOWLEDGE CHECK — FIRST DIGITAL TEST</h3><div class="v93q"><b>1. You are entering a steel/coil loading area where heavy material could roll or fall onto your feet. What is the correct approach?</b><label><input type="radio" name="q1" value="0"> Ordinary sneakers are fine if you stay alert.</label><label><input type="radio" name="q1" value="1"> Use protective safety-toe footwear appropriate for the hazard and site requirements.</label><label><input type="radio" name="q1" value="0"> Only wear thicker socks.</label></div><div class="v93q"><b>2. Before choosing PPE, what comes first?</b><label><input type="radio" name="q2" value="1"> Identify/assess the workplace hazards.</label><label><input type="radio" name="q2" value="0"> Pick whichever PPE looks strongest.</label><label><input type="radio" name="q2" value="0"> Wait until an injury happens.</label></div><div class="v93q"><b>3. If PPE is damaged or defective, what should the student learn?</b><label><input type="radio" name="q3" value="0"> Use it carefully until the shift ends.</label><label><input type="radio" name="q3" value="1"> Do not use defective or damaged PPE.</label><label><input type="radio" name="q3" value="0"> Tape it and continue regardless of the hazard.</label></div><div class="v93q"><b>4. PPE training should include which of these?</b><label><input type="radio" name="q4" value="1"> When PPE is needed, what is needed, how to wear it, its limits, and care/maintenance.</label><label><input type="radio" name="q4" value="0"> Only the brand name.</label><label><input type="radio" name="q4" value="0"> Only the price.</label></div><div class="v93q"><b>5. Can one generic PPE list replace job-specific hazard assessment?</b><label><input type="radio" name="q5" value="0"> Yes.</label><label><input type="radio" name="q5" value="1"> No. PPE selection must match the actual hazards and task.</label></div><button class="v93submit" id="v93grade">GRADE TEST</button><div class="v93score" id="v93score">Not graded yet.</div></div><div class="v93note">SOURCE FOUNDATION: OSHA 29 CFR 1910.132 general PPE requirements; 1910.136 foot protection; 1910 Subpart I; and applicable construction/task-specific PPE standards. Alaska Ice Crystals lessons/questions are original and should be updated when official requirements change.</div></div></div>`);d.getElementById('v93open').onclick=()=>d.getElementById('v93ov').classList.add('open');d.getElementById('v93close').onclick=()=>d.getElementById('v93ov').classList.remove('open');d.getElementById('v93grade').onclick=()=>{let score=0;for(let i=1;i<=5;i++){const x=d.querySelector('input[name=q'+i+']:checked');if(x)score+=Number(x.value)}const pct=score*20;d.getElementById('v93score').textContent='Score: '+pct+'% — '+(pct>=80?'PASS':'REVIEW LESSON AND RETEST');};const hud=d.querySelector('.hud>div:first-child');if(hud)hud.innerHTML='<strong>V93 • DIGITAL SAFETY + PPE</strong>V92 preserved • separate safety department • steel-toe/protective footwear included as core training';const status=d.querySelector('.status');if(status)status.textContent='V93 ADDS A SEPARATE DIGITAL SAFETY + PPE DEPARTMENT WITH STEEL-TOE / SAFETY-TOE FOOTWEAR, HAZARD RECOGNITION, PPE SELECTION, CROSS-DEPARTMENT SAFETY GATES, AND A WORKING DIGITAL KNOWLEDGE CHECK. V92 AND EARLIER BUILDS REMAIN SAFE.';}f.addEventListener('load',()=>setTimeout(install,1000));setTimeout(install,1700);setInterval(()=>{if(!done)install()},900)})();</script></body></html>
