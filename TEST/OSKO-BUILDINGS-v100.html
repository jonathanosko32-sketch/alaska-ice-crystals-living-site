</style></head><body><header><a href="./SKIE-HOUSE-v100.html?v=100a">← SKIE’s house</a><h1>OSKO · The Buildings</h1><a href="./phone/OSKO-Living-OS-PHONE-INSTALL-v6.html?v=house100">The yard →</a></header><main><div class="exterior" id="exterior" role="img" aria-label=""><div class="sign"><span id="sign"></span></div></div><p class="error" id="error" hidden>Building artwork could not load. Please refresh when you are online.</p><nav class="building-nav" aria-label="Choose a building"><button id="previous" aria-label="Previous building">←</button><select id="building" aria-label="Building"></select><button id="next" aria-label="Next building">→</button></nav><section class="details"><h2 id="name"></h2><p id="description"></p><p id="status"></p><a id="enter" href="./SKIE-HOUSE-v100.html?v=100a">Enter SKIE’s house</a></section></main><script src="./buildings-v100.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const buildings=[
['hq','Alaska Ice Crystals Headquarters','OSKO<br>Headquarters','The home of SKIE’s working desk, living rooms, bedroom, and empty basement.'],
['shop','OSKO Workshop','OSKO<br>Workshop','A timber workshop with broad doors, warm work lighting, and a finished entrance.'],
['school','School & Library','School &<br>Library','A welcoming lodge with generous reading windows and a sheltered front door.'],
['robots','Robot Garage','Robot<br>Garage','A timber and glass engineering building with garage bays.'],
['aurora','Aurora Cabin','Aurora<br>Cabin','A smaller porch cabin beneath the northern lights.'],
['crystal-lab','Crystal Lab','Crystal<br>Lab','Stone and timber architecture with crystal-blue laboratory windows.'],
['grow-house','Grow House','Grow<br>House','A warm timber-framed growing building with large plant windows.'],
['equipment-barn','Equipment Barn','Equipment<br>Barn','A substantial timber barn with tall equipment doors.'],
['work-shed','Work Shed','Work<br>Shed','A compact timber work building with a sheltered entrance.'],
['fishing-shelter','Fishing Shelter','Fishing<br>Shelter','A lakeside shelter with a snowy dock.'],
['greenhouse','Greenhouse','Greenhouse','A timber and glass greenhouse with warm growing space.'],
['gate','Alaska Ice Crystals Gate','Alaska Ice<br>Crystals','The entrance to your Alaska grounds.']];
const options=$('building');for(const [id,name]of buildings){const o=document.createElement('option');o.value=id;o.textContent=name;options.appendChild(o)}
let selected=Math.max(0,buildings.findIndex(b=>b[0]===new URLSearchParams(location.search).get('building')));
const image=new Image();image.onload=()=>{$('error').hidden=true};image.onerror=()=>{$('error').hidden=false};image.src=window.OSKO_BUILDINGS_100||'';$('exterior').style.backgroundImage='url("'+image.src+'")';
function show(index){selected=(index+buildings.length)%buildings.length;const [id,name,sign,description]=buildings[selected],col=selected%4,row=Math.floor(selected/4);$('exterior').style.backgroundPosition=(col/3*100)+'% '+(row/2*100)+'%';$('exterior').setAttribute('aria-label','Realistic winter exterior of '+name);$('sign').innerHTML=sign;$('name').textContent=name;$('description').textContent=description;$('status').textContent=id==='hq'?'Three house floors are ready to enter.':'Exterior and sign ready. The inside is reserved for your OS design.';$('enter').hidden=id!=='hq';options.value=id;history.replaceState(null,'',location.pathname+'?building='+encodeURIComponent(id))}
options.onchange=()=>show(buildings.findIndex(b=>b[0]===options.value));$('previous').onclick=()=>show(selected-1);$('next').onclick=()=>show(selected+1);show(selected);
})();
</script></body></html>
