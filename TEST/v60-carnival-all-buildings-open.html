el.textContent.trim().replace(/\s+/g,' ')||'CARNIVAL BUILDING';function openBuilding(el,e){if(e){e.preventDefault();e.stopPropagation()}const name=labelFor(el);if(title)title.textContent=name;if(center)center.textContent=name+' — INTERIOR READY TO BUILD';if(interior){interior.classList.add('open');interior.setAttribute('aria-hidden','false')}el.classList.add('v60flash');setTimeout(()=>el.classList.remove('v60flash'),500)}const targets=[...c.querySelectorAll('.booth,.v58b,.v59b,.v59cell')];targets.forEach(el=>{el.classList.add('v60open');if(!el.dataset.name)el.dataset.name=labelFor(el);el.addEventListener('click',e=>openBuilding(el,e),true);el.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();openBuilding(el,e)}, {passive:false,capture:true})});const hud=d.querySelector('.hud .card:first-child');if(hud)hud.innerHTML='<strong>LIVING WORLD V60</strong>All carnival booths, halls, stores, food + game buildings open';const stamp=d.querySelector('.stamp');if(stamp)stamp.textContent='V60 • V59 PRESERVED • ALL CARNIVAL BUILDINGS OPEN • RIDES REMAIN RIDES • TEST';}root.addEventListener('load',()=>setTimeout(install,3800));setTimeout(install,4800);setInterval(()=>{if(!done)install()},1000)})();</script></body></html>
