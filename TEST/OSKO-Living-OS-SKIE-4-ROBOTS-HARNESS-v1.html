<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OSKO SKIE + 4 Robots Harness v1</title><style>body{margin:0;background:#07111a;color:#eaf8ff;font-family:system-ui,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#0d1c29;border:1px solid #28506b;border-radius:16px;padding:14px;margin:10px 0}.ok{border-color:#2b8b63}.bad{border-color:#a84b4b}.wait{border-color:#806d2d}h1{font-size:22px;margin:0 0 4px}.muted{opacity:.72;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-weight:700}.robot{padding:8px 0;border-top:1px solid #173247}.robot:first-child{border-top:0}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;margin-top:10px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}</style>
<script src="modules/osko-event-bus-v1.js"></script><script src="modules/osko-permission-core-v1.js"></script><script src="modules/osko-robot-fleet-core-v1.js"></script><script src="modules/osko-robot-job-core-v1.js"></script><script src="modules/osko-dock-status-core-v1.js"></script><script src="modules/osko-skie-robot-coordinator-v1.js"></script><script src="modules/osko-robot-simulation-core-v1.js"></script></head><body><main><h1>OSKO Living OS</h1><div class="muted">SKIE + Four Robot Integration Harness v1 — simulation only</div><div id="summary" class="card wait">Starting tests…</div><div id="tests"></div><div id="robots" class="card"></div><button onclick="runAll()">RUN TESTS AGAIN</button><div class="card"><b>Safety boundary</b><div class="muted">This harness does not control physical motors, promote releases, or modify protected builds.</div></div></main><script>
(function(){'use strict';
const testsEl=document.getElementById('tests'), summaryEl=document.getElementById('summary'), robotsEl=document.getElementById('robots');
function card(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'ok':'bad');d.innerHTML='<div class="row"><b>'+name+'</b><span class="tag">'+(ok?'PASS':'FAIL')+'</span></div><div class="muted"></div>';d.querySelector('.muted').textContent=detail||'';testsEl.appendChild(d);return ok;}
function safe(fn){try{return fn();}catch(e){return {__error:String(e&&e.message||e)}}}
window.runAll=function(){testsEl.innerHTML=''; let pass=0,total=0; function t(n,fn,detail){total++;const r=safe(fn);const ok=r===true||(r&&r.ok===true); if(ok)pass++;card(n,ok,detail?detail(r):((r&&r.__error)||JSON.stringify(r)));return r;}
const globals=t('Required robot modules loaded',()=>!!(window.OSKOEventBus&&window.OSKOPermissionCore&&window.OSKORobotFleet&&window.OSKORobotJobs&&window.OSKODockStatus&&window.OSKOSKIERobotCoordinator&&window.OSKORobotSimulation),r=>r?'All seven module globals found':'One or more globals missing');
if(globals!==true){summaryEl.className='card bad';summaryEl.textContent='STOPPED — module load failure';return;}
const bus=OSKOEventBus.create(); const permission=OSKOPermissionCore.create({eventBus:bus}); const fleet=OSKORobotFleet.create({eventBus:bus,permission,maxRobots:4}); const jobs=OSKORobotJobs.create({eventBus:bus,permission,fleet}); const docks=OSKODockStatus.create({eventBus:bus}); const skie=OSKOSKIERobotCoordinator.create({eventBus:bus,permission,fleet,jobs,docks}); const sim=OSKORobotSimulation.create({eventBus:bus,fleet,jobs});
t('Fleet initializes all four work bodies',()=>fleet.status().count===4,r=>'Fleet count: '+fleet.status().count);
['robot-1','robot-2','robot-3','robot-4'].forEach((id,i)=>{fleet.updateTelemetry(id,{connected:true,docked:i===3,battery:90-i*7,location:i===3?'dock':'property',localSafety:true});docks.set(id,{kind:'robot',connected:true,docked:i===3,charging:false,battery:90-i*7});});
t('All four robots become ready',()=>fleet.status().ready===4,r=>'Ready: '+fleet.status().ready+' / 4');
t('SKIE is registered as restricted central brain',()=>{const p=permission.describe('skie');return !!p&&p.denied.includes('robot.hardware.control')&&p.capabilities.includes('robot.job.submit')},r=>'SKIE may submit work but hardware control is denied');
t('Protected physical action is blocked',()=>skie.request({action:'physical-actuation',target:'robot-1'}).ok===false,r=>'SKIE cannot turn a request into direct physical actuation');
t('False charging state is rejected',()=>{const s=docks.set('robot-2',{connected:true,docked:false,charging:true,battery:74});return s.charging===false&&s.displayState==='CONNECTED / READY'},r=>docks.snapshot('robot-2').displayState);
const requested=[]; ['workshop','truck','school','robot-garage'].forEach((target,i)=>requested.push(skie.request({action:i===3?'dock':'inspect',target,priority:80-i}))); t('SKIE queues four approved simulated jobs',()=>requested.every(x=>x&&x.ok),r=>'Queued jobs: '+jobs.status().queued);
const dispatched=[];for(let i=0;i<4;i++)dispatched.push(skie.dispatch()); t('Dispatcher assigns work across four robot bodies',()=>{const ids=dispatched.filter(x=>x&&x.ok).map(x=>x.robot.id);return ids.length===4&&new Set(ids).size===4},r=>'Assigned: '+dispatched.filter(x=>x&&x.ok).map(x=>x.robot.id).join(', '));
let simsOk=true; dispatched.forEach(d=>{if(!d||!d.ok){simsOk=false;return;}const b=sim.begin(d.job); if(!b.ok){simsOk=false;return;}const rr=sim.runToEnd(d.job.id); if(!rr.ok){simsOk=false;return;}const fin=sim.finishIntoJobCore(d.job.id,{ok:true,simulation:true,report:'completed safely'}); if(!fin.ok)simsOk=false;}); t('All four simulated jobs run to completion',()=>simsOk&&jobs.status().complete===4,r=>'Completed: '+jobs.status().complete+' / 4');
const tb=skie.request({action:'test-build',target:'candidate-vNext'});const td=skie.dispatch();let reportOnly=false;if(tb.ok&&td.ok){const b=sim.begin(td.job);const rr=b.ok?sim.runToEnd(td.job.id):{ok:false};if(rr.ok){const s=rr.simulation;reportOnly=s.steps.includes('report-only-no-activation');sim.finishIntoJobCore(td.job.id,{ok:true,activated:false,reportOnly:true});}}t('Test-build work ends in report-only mode',()=>reportOnly,r=>'Candidate checked; activation remains owner-controlled');
const list=fleet.list();robotsEl.innerHTML='<b>Four Robot Status</b>'+list.map(r=>'<div class="robot"><div class="row"><span>'+r.name+'</span><span>'+ (docks.label(r.id)) +'</span></div><div class="muted">Battery: '+(r.battery==null?'unknown':r.battery+'%')+' · Mode: '+r.mode+' · Location: '+r.location+'</div></div>').join('');
summaryEl.className='card '+(pass===total?'ok':'bad');summaryEl.innerHTML='<div class="row"><b>Integration result</b><span class="tag">'+pass+' / '+total+' PASS</span></div><div class="muted">SKIE remains the central coordinator. Robot jobs in this harness are simulation-only.</div>';
}; runAll();
})();
</script></body></html>
