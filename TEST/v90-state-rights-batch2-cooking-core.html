ood-safe'],['Safe Minimum Internal Temperatures','OFFICIAL • USDA FSIS','Student learns thermometer use and safe minimum temperatures for meat, poultry, fish, eggs, leftovers and casseroles.','https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/safe-temperature-chart'],['Food Thermometer Skills','OFFICIAL • USDA FSIS','Interactive future lesson: choose the right thermometer position, verify temperature and avoid guessing doneness by color or appearance.','https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/food-thermometers'],['Temperature Danger Zone + Storage','OFFICIAL • USDA FSIS','Future kitchen simulator lessons will teach safe hot/cold holding, refrigeration, thawing, leftovers, reheating and time/temperature control.','https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/how-temperatures-affect-food'],['Cooking Practice Test Engine','ALASKA ICE CRYSTALS • ORIGINAL','Course slot for original questions, kitchen decisions, thermometer scenarios, ingredient measurement, timing, recipe math and practical digital cooking assignments.','#'],['Truck / Camp / Home Cooking Simulator','ALASKA ICE CRYSTALS • ORIGINAL','Future hands-on digital course for limited-space cooking, camp cooking, truck cooking, home kitchen work, cleanup, storage and meal planning.','#']];function card(x,cls){return `<div class="v90card ${cls}"><span class="v90tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p>${x[3]&&x[3]!=='#'?`<button data-url="${x[3]}">OPEN OFFICIAL SOURCE</button>`:''}</div>`}function show(t){d.querySelectorAll('.v90tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));const c=d.getElementById('v90content');c.innerHTML=`<div class="v90grid">${(t==='states'?states:cooking).map(x=>card(x,t==='states'?'v90hold':'v90safe')).join('')}</div>`;c.querySelectorAll('button[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank'));}d.g
