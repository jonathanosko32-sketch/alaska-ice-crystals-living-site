<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OSKO Living OS Module Harness v3</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07111d;color:#eef6ff;margin:0;padding:16px}h1{font-size:22px;margin:0 0 8px}.sub{opacity:.78;margin-bottom:14px}.card{background:#0d1c2d;border:1px solid #27425d;border-radius:14px;padding:12px;margin:10px 0}.pass{border-color:#2f8f62}.fail{border-color:#b84a4a}.warn{border-color:#a57b2c}.row{display:flex;justify-content:space-between;gap:12px}.name{font-weight:700}.status{font-weight:800}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#08131f;padding:10px;border-radius:10px}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #55708c;background:#17314a;color:white}</style></head><body><h1>OSKO Living OS — Module Harness v3</h1><div class="sub">Isolated integration + lifecycle/persistence test. Does not replace V11 or FIX8.</div><button id="run">RUN TESTS</button><div id="summary" class="card warn">Waiting to run.</div><div id="results"></div>
<script src="modules/osko-event-bus-v1.js"></script>
<script src="modules/osko-world-state-v1.js"></script>
<script src="modules/osko-object-registry-v1.js"></script>
<script src="modules/osko-camera-navigation-v1.js"></script>
<script src="modules/osko-scene-binding-v1.js"></script>
<script src="modules/osko-scene-state-sync-v1.js"></script>
<script src="modules/osko-safety-policy-v1.js"></script>
<script src="modules/osko-action-core-v1.js"></script>
<script src="modules/osko-runtime-core-v1.js"></script>
<script src="modules/osko-interaction-router-v1.js"></script>
<script src="modules/osko-integration-readiness-v1.js"></script>
<script src="modules/osko-integration-session-v1.js"></script>
<script src="modules/osko-visual-integration-bridge-v1.js"></script>
<script src="modules/osko-property-integration-core-v1.js"></script>
<script src="modules/osko-state-persistence-v1.js"></script>
<script src="modules/osko-diagnostics-core-v1.js"></script>
<script src="modules/osko-command-journal-v1.js"></script>
<script src="modules/osko-lifecycle-core-v1.js"></script>
<script>
(function(){'use strict';const out=document.getElementById('results'),summary=document.getElementById('summary');function card(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'pass':'fail');d.innerHTML='<div class="row"><span class="name">'+name+'</span><span class="status">'+(ok?'PASS':'FAIL')+'</span></div><pre></pre>';d.querySelector('pre').textContent=typeof detail==='string'?detail:JSON.stringify(detail,null,2);out.appendChild(d)}function need(n,v){if(!v)throw new Error(n+' unavailable');return v}async function run(){out.innerHTML='';summary.className='card warn';summary.textContent='Running...';const tests=[];function check(name,fn){tests.push({name,fn})}try{const eventBus=need('OSKOEventBus',window.OSKOEventBus).create({maxHistory:120});const worldState=need('OSKOWorldState',window.OSKOWorldState).create();const registry=need('OSKOObjectRegistry',window.OSKOObjectRegistry).create();const camera=need('OSKOCameraNavigation',window.OSKOCameraNavigation).create({eventBus});const sceneBinding=need('OSKOSceneBinding',window.OSKOSceneBinding).create({eventBus});const sceneSync=need('OSKOSceneStateSync',window.OSKOSceneStateSync).create({eventBus});const safety=need('OSKOSafetyPolicy',window.OSKOSafetyPolicy).create();const actions=need('OSKOActionCore',window.OSKOActionCore);const persistence=need('OSKOStatePersistence',window.OSKOStatePersistence).create({storageKey:'osko.harness.v3',maxCheckpoints:6});const diagnostics=need('OSKODiagnostics',window.OSKODiagnostics).create({eventBus});const journal=need('OSKOCommandJournal',window.OSKOCommandJournal).create({eventBus,persistence,maxEntries:200});const visual={position:{x:12,y:4,z:-30},visible:true,open:false};registry.register({id:'hq',name:'AIC HQ',type:'building',aliases:['headquarters']});actions.register({id:'hq',name:'AIC HQ',type:'building',state:{open:false},actions:{open:({setState})=>setState({open:true}),close:({setState})=>setState({open:false})}});sceneBinding.bind('hq',visual,{group:'property',applyState:(v,s)=>{if(typeof s.open==='boolean')v.open=s.open;if(typeof s.visible==='boolean')v.visible=s.visible}});sceneSync.register('hq',{apply:(s)=>sceneBinding.applyState('hq',s),getState:()=>({open:visual.open,visible:visual.visible})});camera.registerTarget('hq',{name:'AIC HQ',position:{x:12,y:55,z:70},lookAt:{x:12,y:4,z:-30},zoom:1.1,kind:'object'});const runtime=need('OSKORuntime',window.OSKORuntime).create({modules:{eventBus,worldState,actions}});const interaction=need('OSKOInteractionRouter',window.OSKOInteractionRouter).create({actions,registry,safety,eventBus});const readiness=need('OSKOIntegrationReadiness',window.OSKOIntegrationReadiness).create({modules:{eventBus,worldState,runtime,actions,safety,registry,camera,sceneBinding,interaction,persistence,diagnostics,journal}});const session=need('OSKOIntegrationSession',window.OSKOIntegrationSession).create({readiness,sceneBinding,sceneSync,eventBus});const bridge=need('OSKOVisualIntegrationBridge',window.OSKOVisualIntegrationBridge).create({eventBus,sceneBinding,camera,worldState,stateSync:sceneSync});const property=need('OSKOPropertyIntegration',window.OSKOPropertyIntegration).create({registry,sceneBinding,camera,worldState,eventBus});diagnostics.registerStandard('runtime',()=>runtime.status().started!==undefined);diagnostics.registerStandard('worldState',()=>!!worldState.snapshot());const lifecycle=need('OSKOLifecycle',window.OSKOLifecycle).create({runtime,persistence,diagnostics,eventBus,journal});check('Readiness gate accepts actual Action Core API',()=>{const r=readiness.report();return{ok:r.ready,detail:r}});check('Lifecycle starts runtime and diagnostics',()=>{const s=lifecycle.start();return{ok:s.phase==='running'&&runtime.status().started===true,detail:{lifecycle:s,runtime:runtime.status(),diagnostics:diagnostics.summary()}}});check('Lifecycle tick advances runtime',()=>{const before=runtime.status().ticks;const r=lifecycle.tick(Date.now()+16);return{ok:r.ok===true&&runtime.status().ticks>before,detail:r}});check('Persistence checkpoint is created',()=>{const r=lifecycle.checkpoint('harness-v3',{world:worldState.snapshot()});const cps=persistence.listCheckpoints();return{ok:r.ok===true&&cps.some(x=>x.name==='harness-v3'),detail:{result:r,count:cps.length}}});check('Journal receives lifecycle records',()=>{const rows=journal.query({source:'lifecycle'});return{ok:rows.length>=2,detail:rows.slice(-6)}});check('Lifecycle pause/resume is deterministic',()=>{const p=lifecycle.pause('test');const pausedTick=lifecycle.tick();const r=lifecycle.resume();return{ok:p.phase==='paused'&&pausedTick.ok===false&&r.phase==='running',detail:{pause:p,pausedTick,resume:r}}});check('Camera HOME target works',()=>{const r=camera.home();return{ok:r.ok===true,detail:r}});check('Scene state sync reaches visual object',()=>{const r=sceneSync.apply('hq',{visible:false});return{ok:r.ok===true&&visual.visible===false,detail:{result:r,visual}}});check('Interaction router reaches Action Core',async()=>{const r=await interaction.dispatch({source:'touch',action:'OPEN',target:'hq'});return{ok:r&&r.ok===true&&actions.getState('hq').open===true,detail:r}});check('Runtime reaches Action Core perform()',async()=>{const r=await runtime.execute('hq','CLOSE',{}, {source:'touch'});return{ok:r&&r.ok===true&&actions.getState('hq').open===false,detail:r}});check('Property integration recognizes existing registry object',()=>{const id=property.ensureLogical('hq',{name:'AIC HQ'});return{ok:id==='hq'&&!!registry.get('hq'),detail:{id,status:property.status()}}});check('Visual bridge connects without owning render loop',()=>{const s=bridge.connect();const ok=s.connected===true;bridge.disconnect();return{ok,detail:s}});check('Integration session proves readiness',async()=>{session.addTest('bound-hq',()=>!!sceneBinding.get('hq'));const r=await session.prove();return{ok:r.ok===true&&r.phase==='READY_FOR_VISUAL_TEST',detail:r}});let pass=0;for(const t of tests){try{const r=await t.fn();const ok=!!(r&&r.ok);if(ok)pass++;card(t.name,ok,r&&('detail'in r)?r.detail:r)}catch(err){card(t.name,false,String(err&&err.stack||err))}}const total=tests.length;summary.className='card '+(pass===total?'pass':'fail');summary.textContent=pass+'/'+total+' tests passed. '+(pass===total?'READY FOR NEXT INTEGRATION STEP — still not a stable release.':'DO NOT ADVANCE — fix failures first.')}catch(err){summary.className='card fail';summary.textContent='Harness failed to initialize.';card('Initialization',false,String(err&&err.stack||err))}}document.getElementById('run').addEventListener('click',run);run()})();
</script></body></html>
