<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OSKO Phone Conversation + Readiness v6</title><style>body{font-family:system-ui;background:#07111d;color:#eef6ff;margin:0;padding:18px}h1{font-size:22px}.card{background:#0d1c2d;border:1px solid #27415e;border-radius:16px;padding:14px;margin:10px 0}.pass{color:#7df2a7}.fail{color:#ff8f8f}button{font-size:16px;padding:12px 14px;border-radius:12px;border:0;margin:5px 5px 5px 0}.small{opacity:.75;font-size:13px}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><h1>SKIE Phone Conversation + Readiness v6</h1><div class="card"><div id="summary">Running…</div><div class="small">Architecture test only. No real microphone, APK install, or robot motor control.</div></div><div id="tests"></div><div class="card"><button id="barge">Simulate Barge-In</button><button id="lifecycle">Simulate Screen Off</button><pre id="status"></pre></div>
<script src="modules/osko-phone-conversation-session-v1.js"></script><script src="modules/osko-phone-readiness-core-v1.js"></script><script>
(function(){
const rows=[];function test(name,fn){try{const r=fn();rows.push({name,ok:!!r});}catch(e){rows.push({name,ok:false,error:e.message});}}
const audioState={listening:false,speaking:false};const audio={startListening(){audioState.listening=true;return{ok:true}},stopListening(){audioState.listening=false;return{ok:true}},stop(){audioState.speaking=false;return{ok:true}},completeSpeech(){audioState.speaking=false;return{ok:true}}};
let lifecycleOK=true;const lifecycle={canAcceptVoice(){return lifecycleOK}};const wake={arm(){return{ok:true}},disarm(){return{ok:true}}};
let responseSpeaking=false;const responses={status(){return{queued:0,speaking:responseSpeaking?{id:'r1'}:null}},complete(){responseSpeaking=false;return{ok:true}},stop(){responseSpeaking=false;return{ok:true}}};
const voiceLoop={handleTranscript(t){responseSpeaking=true;audioState.speaking=true;return{ok:true,result:{intent:{type:'navigation',target:'school'},text:t},response:'Done.'}}};
const session=OSKOPhoneConversationSession.create({lifecycle,audio,wakeSession:wake,voiceLoop,responses,timeoutMs:5000});
test('Conversation session starts only when lifecycle allows voice',()=>session.start().ok&&session.status().phase==='listening'&&audioState.listening);
test('Transcript moves session through thinking to responding',()=>session.transcript('take me to the school').ok&&session.status().phase==='responding'&&audioState.speaking);
test('Barge-in stops speech and returns to listening',()=>session.bargeIn().ok&&session.status().phase==='listening'&&audioState.listening);
test('Second transcript can be accepted after barge-in',()=>session.transcript('robot four inspect the truck').ok&&session.status().phase==='responding');
test('Speech completion ends the session safely',()=>session.speechComplete('r1').ok&&session.status().phase==='ended');
session.reset();lifecycleOK=false;test('Session refuses to start when lifecycle blocks voice',()=>session.start().ok===false&&session.start().error==='VOICE_NOT_AVAILABLE');lifecycleOK=true;
const modules={androidHost:{},phoneRuntime:{},phoneService:{},lifecycle:{},audio:{},wakeSession:{},voiceLoop:{},responses:{},conversationSession:session,installProfile:{},upgradeOrchestrator:{},dataContinuity:{}};
const readiness=OSKOPhoneReadiness.create({modules,checks:{protectedBaselines(){return{ok:true,v11:true,fix8:true}},noPhysicalMotorControl(){return true}}});
test('Readiness refuses stable status without phone confirmation',()=>readiness.run({syntaxChecked:true,browserHarnessPassed:true,phoneConfirmed:false}).ready===false);
test('Readiness can pass only after syntax + harness + phone confirmation',()=>readiness.run({syntaxChecked:true,browserHarnessPassed:true,phoneConfirmed:true}).ready===true);
function render(){document.getElementById('tests').innerHTML=rows.map(r=>'<div class="card '+(r.ok?'pass':'fail')+'">'+(r.ok?'PASS ':'FAIL ')+r.name+(r.error?' — '+r.error:'')+'</div>').join('');const passed=rows.filter(r=>r.ok).length;document.getElementById('summary').innerHTML='<b>'+passed+'/'+rows.length+' checks passed</b>';document.getElementById('status').textContent=JSON.stringify({conversation:session.status(),readiness:readiness.run({syntaxChecked:true,browserHarnessPassed:true,phoneConfirmed:false})},null,2)}render();
document.getElementById('barge').onclick=function(){responseSpeaking=true;audioState.speaking=true;if(session.status().phase!=='responding'){session.reset();session.start();session.transcript('show school')}session.bargeIn();render()};document.getElementById('lifecycle').onclick=function(){lifecycleOK=false;session.onLifecycle();render()};
})();
</script></body></html>
