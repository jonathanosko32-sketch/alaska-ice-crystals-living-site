<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OSKO Phone Lifecycle + Offline Harness v5</title><style>body{font-family:system-ui;background:#08131c;color:#eaf6ff;margin:0;padding:16px}h1{font-size:22px}button{font-size:18px;padding:12px 14px;margin:6px 0;width:100%}.pass{color:#8cffb0}.fail{color:#ff8c8c}.card{background:#102532;border:1px solid #28546b;border-radius:14px;padding:12px;margin:10px 0}code{white-space:pre-wrap}</style></head><body><h1>OSKO Living OS — Phone Lifecycle + Offline Harness v5</h1><p>Software harness only. No microphone capture, APK install, or physical motor control.</p><button id="run">RUN TESTS</button><div id="out"></div><script src="modules/osko-phone-lifecycle-bridge-v1.js"></script><script src="modules/osko-local-command-fallback-v1.js"></script><script>
(function(){'use strict';const out=document.getElementById('out');function line(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'pass':'fail');d.textContent=(ok?'PASS — ':'FAIL — ')+name+(detail?' — '+detail:'');out.appendChild(d);return ok;}function run(){out.innerHTML='';let passed=0,total=0;const calls=[];const service={s:{eligible:true},update(x){this.s=Object.assign({},this.s,x);this.s.eligible=this.s.thermal!=='critical'&&this.s.appState==='foreground'&&this.s.screenOn!==false;return this.s;},canListen(){return !!this.s.eligible;}};const lifecycle=OSKOPhoneLifecycleBridge.create({phoneService:service});total++;passed+=line('create lifecycle',lifecycle.apply('create').ok);total++;passed+=line('resume foreground',lifecycle.apply('resume').state.resumed===true);total++;passed+=line('voice eligible in foreground',lifecycle.canAcceptVoice()===true);lifecycle.apply('thermal',{state:'critical'});total++;passed+=line('critical heat blocks listening',lifecycle.canAcceptVoice()===false);lifecycle.apply('thermal',{state:'normal'});lifecycle.apply('screen',{on:false});total++;passed+=line('screen off blocks listening',lifecycle.canAcceptVoice()===false);lifecycle.apply('screen',{on:true});
const robots={request(req){calls.push(req);return {ok:true,assignedRobot:req.payload&&req.payload.preferredRobot||null,action:req.action,target:req.target};}};const propertyExecute=(intent)=>{calls.push(intent);return {ok:true,target:intent.target,action:intent.action};};const local=OSKOLocalCommandFallback.create({robotCoordinator:robots,propertyExecute});let r=local.execute('take me to school');total++;passed+=line('offline property command',r.ok&&r.intent&&r.intent.target==='school');r=local.execute('robot four inspect truck');total++;passed+=line('offline named Robot Four',r.ok&&r.result&&r.result.assignedRobot==='robot-4');r=local.execute('disable safety');total++;passed+=line('protected offline command blocked',r.ok===false&&r.error==='PROTECTED_ACTION');r=local.execute('tell me a long story');total++;passed+=line('unsupported cloud-like request stays local-safe',r.ok===false&&r.error==='LOCAL_COMMAND_NOT_SUPPORTED');const s=document.createElement('div');s.className='card';s.innerHTML='<b>'+passed+' / '+total+' tests passed</b><br><code>'+JSON.stringify({lifecycle:lifecycle.status(),calls},null,2)+'</code>';out.appendChild(s);}document.getElementById('run').onclick=run;run();})();
</script></body></html>
