<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OSKO Phone Runtime Harness v1</title><style>body{margin:0;background:#07111a;color:#eaf8ff;font-family:system-ui,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#0d1c29;border:1px solid #28506b;border-radius:16px;padding:14px;margin:10px 0}.ok{border-color:#2b8b63}.bad{border-color:#a84b4b}.wait{border-color:#806d2d}h1{font-size:22px;margin:0 0 4px}.muted{opacity:.72;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-weight:700}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;margin-top:10px}</style>
<script src="modules/osko-event-bus-v1.js"></script><script src="modules/osko-permission-core-v1.js"></script><script src="modules/osko-android-host-core-v1.js"></script><script src="modules/osko-wake-session-core-v1.js"></script><script src="modules/osko-voice-intent-v1.js"></script><script src="modules/osko-robot-fleet-core-v1.js"></script><script src="modules/osko-robot-job-core-v1.js"></script><script src="modules/osko-dock-status-core-v1.js"></script><script src="modules/osko-skie-robot-coordinator-v1.js"></script><script src="modules/osko-skie-voice-command-bridge-v1.js"></script><script src="modules/osko-phone-runtime-core-v1.js"></script></head><body><main><h1>OSKO Living OS</h1><div class="muted">Phone Runtime Harness v1 — Android-hosted stage, no microphone hardware yet</div><div id="summary" class="card wait">Starting tests…</div><div id="tests"></div><button onclick="runAll()">RUN TESTS AGAIN</button><div class="card"><b>What this proves</b><div class="muted">Android host readiness, Hey SKIE wake flow, property command routing, named Robot Four routing, protected-command blocking, truthful dock state, and offline behavior.</div></div></main><script>
(function(){'use strict';const testsEl=document.getElementById('tests'),summaryEl=document.getElementById('summary');function card(name,ok,detail){const d=document.createElement('div');d.className='card '+(ok?'ok':'bad');d.innerHTML='<div class="row"><b>'+name+'</b><span class="tag">'+(ok?'PASS':'FAIL')+'</span></div><div class="muted"></div>';d.querySelector('.muted').textContent=detail||'';testsEl.appendChild(d);return ok;}function safe(fn){try{return fn();}catch(e){return {__error:String(e&&e.message||e)}}}
window.runAll=function(){testsEl.innerHTML='';let pass=0,total=0;function t(n,fn,detail){total++;const r=safe(fn);const ok=r===true||(r&&r.ok===true);if(ok)pass++;card(n,ok,detail?detail(r):((r&&r.__error)||JSON.stringify(r)));return r;}
const globals=t('Phone runtime modules loaded',()=>!!(window.OSKOEventBus&&window.OSKOPermissionCore&&window.OSKOAndroidHost&&window.OSKOWakeSession&&window.OSKOVoiceIntent&&window.OSKORobotFleet&&window.OSKORobotJobs&&window.OSKODockStatus&&window.OSKOSKIERobotCoordinator&&window.OSKOSKIEVoiceCommandBridge&&window.OSKOPhoneRuntime),r=>r?'All required globals found':'One or more modules missing');if(globals!==true){summaryEl.className='card bad';summaryEl.textContent='STOPPED — module load failure';return;}
const bus=OSKOEventBus.create(),permission=OSKOPermissionCore.create({eventBus:bus}),host=OSKOAndroidHost.create({eventBus:bus}),wake=OSKOWakeSession.create({eventBus:bus,wakePhrases:['hey skie','skie']}),fleet=OSKORobotFleet.create({eventBus:bus,permission,maxRobots:4}),jobs=OSKORobotJobs.create({eventBus:bus,permission,fleet}),docks=OSKODockStatus.create({eventBus:bus});['robot-1','robot-2','robot-3','robot-4'].forEach((id,i)=>{fleet.updateTelemetry(id,{connected:true,docked:i===3,battery:88-i*6,location:i===3?'dock':'property',localSafety:true});docks.set(id,{connected:true,docked:i===3,charging:false,battery:88-i*6});});const skie=OSKOSKIERobotCoordinator.create({eventBus:bus,permission,fleet,jobs,docks});const vi=OSKOVoiceIntent.create();let propertyLast=null;const vb=OSKOSKIEVoiceCommandBridge.create({eventBus:bus,permission,robotCoordinator:skie,voiceIntent:vi,propertyExecute:(intent)=>{propertyLast=intent;return {ok:true,handled:'property'};}});const phone=OSKOPhoneRuntime.create({eventBus:bus,androidHost:host,wakeSession:wake,voiceBridge:vb,fleet,docks});
t('Android host requires real capabilities',()=>phone.connectHost({androidVersion:'16',capabilities:['network','storage','audio','microphone','camera']}).ok,r=>'Android host ready with network, storage, audio, microphone and camera');
t('Voice can be armed only after host is ready',()=>phone.armVoice(true).ok,r=>'Wake session armed');
const prop=t('Hey SKIE routes property command',()=>phone.hear('Hey SKIE take me to the school',{actor:'owner',local:true}),r=>'Result: '+(r&&r.result&&r.result.intent&&r.result.intent.objectId||'none'));
t('Property command reached School',()=>!!propertyLast&&propertyLast.objectId==='school',r=>'Target: '+(propertyLast&&propertyLast.objectId));
const rr=t('Hey SKIE can request Robot Four specifically',()=>phone.hear('Hey SKIE robot four inspect the truck',{actor:'owner',local:true}),r=>'Voice request accepted');
const dispatched=skie.dispatch();t('Named Robot Four receives its requested job',()=>!!(dispatched&&dispatched.ok&&dispatched.robot&&dispatched.robot.id==='robot-4'),r=>'Assigned: '+(dispatched&&dispatched.robot&&dispatched.robot.id||'none'));
t('Protected physical request stays blocked',()=>{const x=phone.hear('Hey SKIE robot four control motor',{actor:'owner',local:true});return x.ok===false&&x.result&&x.result.error==='PROTECTED_OR_PHYSICAL_ACTION';},r=>'Direct motor control remains blocked');
t('Dock status stays truthful',()=>{const x=docks.set('robot-2',{connected:true,docked:false,charging:true,battery:72});return x.charging===false&&x.displayState==='CONNECTED / READY';},r=>docks.label('robot-2'));
phone.disconnectHost('test-offline');t('Offline phone refuses voice command',()=>phone.hear('Hey SKIE show me the school',{actor:'owner',local:true}).error==='PHONE_HOST_NOT_READY',r=>'Voice correctly unavailable while host is offline');
summaryEl.className='card '+(pass===total?'ok':'bad');summaryEl.innerHTML='<div class="row"><b>Phone runtime result</b><span class="tag">'+pass+' / '+total+' PASS</span></div><div class="muted">No physical robot control or real microphone capture occurs in this harness.</div>';};runAll();})();
</script></body></html>
