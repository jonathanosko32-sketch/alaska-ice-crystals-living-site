chool flow. It is not a finished driving physics engine yet. It shows how the student moves from classroom instruction into a simulator station, what controls the station needs, how lessons attach to it, and how progress/grading comes back to the school.</div><div class="v94tabs"><button class="on" data-p="camp">1 • SCHOOL AREAS</button><button data-p="sim">2 • SIMULATOR STATION</button><button data-p="flow">3 • STUDENT LESSON FLOW</button></div><div class="v94panel on" id="camp"><div class="campus"><div class="zone hot"><h3>MAIN LOG-CABIN SCHOOL</h3><p>Student check-in, classrooms, instructor spaces, digital library, testing, progress records and department selection.</p></div><div class="zone"><h3>SIMULATOR HALL</h3><p>Individual training bays with truck controls, screens/headset support, instructor/AI monitoring and replay/scoring.</p></div><div class="zone"><h3>PRE-TRIP + INSPECTION LAB</h3><p>Walk-around inspection, defects, tires, brakes, lights, coupling, fluids and safety checks before driving lessons.</p></div><div class="zone"><h3>LOAD + SECUREMENT LAB</h3><p>Dry van, reefer, flatbed, step deck, RGN, coils, machinery, blocking/bracing, chains/straps/binders and rechecks.</p></div><div class="zone"><h3>FUEL / DEF / REEFER FUEL</h3><p>Fuel-island procedures, spill prevention, DEF, reefer tank, receipts, shutdown rules and site safety.</p></div><div class="zone"><h3>SAFETY + PPE</h3><p>Steel-toe/safety-toe footwear, high visibility, gloves, eye/face, head, hearing, respiratory awareness, fall and cold-weather PPE.</p></div><div class="zone"><h3>MAP / HOS / ELD CLASSROOM</h3><p>Digital atlas, route planning, Alaska/lower-48 HOS, paper logs, ELD operation, malfunctions and backup procedures.</p></div><div class="zone"><h3>HEAVY EQUIPMENT</h3><p>Future operator/refresher modules for loaders, excavators, tractors, forklifts, dozers and equipment-loading scenarios.</p></div><div class="zone"><h3>OTHER SCHOOL DEPARTMENTS</h3><p>Car, motorcycle, aviation/drone, mechanics, cooking and future programs plug into the same student/testing system.</p></div></div></div><div class="v94panel" id="sim"><div class="simroom"><div class="screenrow"><div class="screen"></div><div class="screen"></div><div class="screen"></div></div><div class="cockpit"><div class="module"><h4>TRUCK STEERING + PEDALS</h4><div class="wheel"><div class="hub"></div></div><div class="pedals"><div class="ped">CLUTCH</div><div class="ped">BRAKE</div><div class="ped">THROTTLE</div></div><div class="auto">Turn-signal / wiper stalks + force-feedback steering belong here.</div></div><div class="module"><h4>18-SPEED + AUTOMATIC</h4><div class="shifter"><div class="knob">18-SPEED<br>RANGE / SPLIT</div></div><div class="auto">Same station can switch lesson mode to AUTOMATIC so students learn both manual and automatic operation.</div><div class="air"><b class="yellow">TRACTOR<br>PARK</b><b class="red">TRAILER<br>AIR</b></div></div><div class="module"><h4>LESSON / INSTRUCTOR PANEL</h4><div class="lessonbox"><div class="lesson"><b>Current:</b><br>Start + stop</div><div class="lesson"><b>Next:</b><br>Mirror scan</div><div class="lesson"><b>Errors:</b><br>0 critical</div><div class="lesson"><b>Mode:</b><br>Student #1</div></div><div class="progress">AI instructor can watch repeatable steps, pause the lesson, explain mistakes, replay the event, and send the score back to the student's record.</div></div></div><div class="v94note">HEADSET / VR SUPPORT: the station can also support a headset later, but the physical wheel, pedals, shifter and air-brake controls remain important because the student needs muscle-memory and real control placement—not just a game controller.</div></div></div><div class="v94panel" id="flow"><div class="campus"><div class="zone hot"><h3>STEP 1 — LEARN</h3><p>Short digital lesson with text/voice/video later, official source material, diagrams and plain-language explanation.</p></div><div class="zone"><h3>STEP 2 — QUICK CHECK</h3><p>Small quiz verifies the student understood the lesson before unlocking practical work.</p></div><div class="zone"><h3>STEP 3 — SIMULATOR</h3><p>Student performs the actual task: shifting, backing, map route, pre-trip, load securement, fueling or another scenario.</p></div><div class="zone"><h3>STEP 4 — CORRECTION</h3><p>System records mistakes. AI instructor explains what happened and sends the student back to the exact weak area instead of restarting everything.</p></div><div class="zone"><h3>STEP 5 — RETEST</h3><p>Different questions/scenarios reduce memorizing one answer sheet. Student repeats until the required skill is demonstrated.</p></div><div class="zone hot"><h3>STEP 6 — PROGRESS RECORD</h3><p>Lesson passed, score stored, simulator result stored, refresher date/status recorded, next lesson unlocked.</p></div></div><div class="v94note">This is the school engine we keep expanding. Sky can be added later as the visible instructor/voice layer after the lesson systems are stable enough that her videos and explanations attach to real working training.</div></div></div></div>`);const ov=d.getElementById('v94ov');d.getElementById('v94open').onclick=()=>ov.classList.add('open');d.getElementById('v94close').onclick=()=>ov.classList.remove('open');d.querySelectorAll('.v94tabs button').forEach(b=>b.onclick=()=>{d.querySelectorAll('.v94tabs button').forEach(x=>x.classList.remove('on'));d.querySelectorAll('.v94panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');d.getElementById(b.dataset.p).classList.add('on')});const hud=d.querySelector('.hud>div:first-child');if(hud)hud.innerHTML='<strong>V94 • SCHOOL + SIMULATOR WALK-THROUGH</strong>V93 preserved • visual cockpit + school areas + lesson flow';const status=d.querySelector('.status');if(status)status.textContent='V94 MAKES THE SCHOOL AND SIMULATOR EASIER TO UNDERSTAND: TAP SEE THE SCHOOL + SIMULATOR FOR A VISUAL CAMPUS GUIDE, TRUCK-SIMULATOR COCKPIT, AND COMPLETE STUDENT LESSON FLOW. V93 AND EARLIER BUILDS REMAIN SAFE.';}f.a
