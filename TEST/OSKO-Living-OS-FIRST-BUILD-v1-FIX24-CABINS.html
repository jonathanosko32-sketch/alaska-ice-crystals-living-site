<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06131c">
<title>OSKO Living OS — FIX24 All Cabins</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020910;color:#eafcff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#071827 0,#020910 62%,#01050a 100%);z-index:20}
.wrap{text-align:center;padding:24px}.brand{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:clamp(34px,9vw,58px);font-style:italic;font-weight:700;text-shadow:0 0 10px rgba(126,224,255,.75),0 0 24px rgba(58,159,220,.48)}
.sub{margin-top:16px;font-size:11px;letter-spacing:.18em;color:#8fdcf5}.track{width:min(54vw,240px);height:3px;background:#123140;margin:23px auto 0;overflow:hidden;border-radius:999px}.bar{height:100%;width:38%;background:linear-gradient(90deg,#6fccea,#effcff,#7bd5f4);animation:move 1.05s linear infinite;border-radius:999px}.msg{margin-top:13px;font-size:10px;color:#7fa8b8;letter-spacing:.08em}@keyframes move{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
</style></head><body>
<div id="boot"><div class="wrap"><div class="brand">Alaska Ice Crystals</div><div class="sub">STARTING LIVING OS • FIX24 ALL CABINS</div><div class="track"><div class="bar"></div></div><div class="msg" id="msg">Loading blue cabin property…</div></div></div>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
  const r=await fetch('../OSKO-Living-OS-HQ-ALL-CABINS-v104.html?v=fix24',{cache:'no-store'});
  if(!r.ok) throw new Error('HQ cabin build unavailable');
  let html=await r.text();
  html=html.replace('<title>OSKO Living OS — HQ Diamond Depth v66</title>','<title>OSKO Living OS — FIX24 All Cabins</title>');
  html=html.replace('READY • PHONE PERFORMANCE v104','READY • FIX24 • ALL BLUE CABINS');
  html=html.replace('const oskoFrameGap=oskoPhone?1000/30:0;','const oskoFrameGap=oskoPhone?1000/30:0;');
  document.open();document.write(html);document.close();
 }catch(err){console.error(err);msg.textContent='Cabin test could not start. Use FIX8 fallback.';const b=document.querySelector('.bar');if(b)b.style.animation='none';}
})();
</script></body></html>
