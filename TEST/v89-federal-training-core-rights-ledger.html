ilds its own original lessons and tests from laws, regulations, public facts, and sources we are legally allowed to use.</div><div class="v89tabs"><button data-t="federal" class="active">FEDERAL CDL CORE</button><button data-t="rights">LAWYER / PERMISSION LIST</button><button data-t="cooking">COOKING DEPARTMENT</button></div><div id="v89content"></div><div class="v89note">IMPORTANT: appearing on the permission list does not mean a source is forbidden forever. It means Alaska Ice Crystals will not copy it until the reuse right is clearly established or permission/license is obtained.</div></div></div>`);const federal=[['FMCSA Entry-Level Driver Training (ELDT)','OFFICIAL • FMCSA','Baseline federal training requirements for first-time Class A/Class B CDL, Class B→A upgrades, and first-time H/P/S endorsements.','https://www.fmcsa.dot.gov/registration/commercial-drivers-license/entry-level-driver-training-eldt'],['Training Provider Registry — Provider Requirements','OFFICIAL • FMCSA TPR','Provider eligibility, curriculum, instructor and registration requirements. This is the legal path to evaluate later if Alaska Ice Crystals seeks recognition as an ELDT provider.','https://tpr.fmcsa.dot.gov/Provider'],['49 CFR Part 380 — ELDT Curriculum Law','OFFICIAL REGULATION','Federal curriculum requirements including Appendices A–E. Alaska Ice Crystals builds its own presentation, lessons and tests around these required topics.','https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-380'],['49 CFR Part 383 — CDL Standards','OFFICIAL REGULATION','Commercial driver licensing standards, knowledge/skills requirements, endorsements and restrictions.','https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-383'],['49 CFR Part 393 — Parts + Cargo Securement','OFFICIAL REGULATION','Vehicle equipment and cargo-securement requirements used to build legitimate securement lessons and assessments.','https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-393'],['49 CFR Part 395 — Hours of Service','OFFICIAL REGULATION','Federal HOS rules used by the paper-log, ELD, trip-planning and driving-scenario departments.','https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-395']];const pendingStates=['Arizona — official car/CDL/motorcycle manuals verified; reuse rights not yet cleared','Colorado — official car/CDL/motorcycle manuals verified; reuse rights not yet cleared','Georgia — official car/CDL/motorcycle manuals verified; DDS copyright language requires caution / permission review','Florida — official motorcycle material located; full car/CDL rights/source set still under review','Alabama','Arkansas','Connecticut','Delaware','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','North Carolina','North Dakota','Ohio','Oklahoma','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Utah','Vermont','Virginia','West Virginia','Wisconsin','Wyoming'];function card(x,cls=''){return `<div class="v89card ${cls}"><span class="v89tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p>${x[3]?`<button data-url="${x[3]}">OPEN OFFICIAL SOURCE</button>`:''}</div>`}function show(t){d.querySelectorAll('.v89tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));const c=d.getElementById('v89content');if(t==='federal')c.innerHTML=`<div class="v89grid">${federal.map(x=>card(x,'v89ok')).join('')}</div>`;if(t==='rights')c.innerHTML=`<div class="v89intro">DO NOT IMPORT THESE MANUALS YET. Keep them outside the school until permission/reuse rights are confirmed. The list itself is for legal review and project planning.</div><div class="v89list">${pendingStates.map(x=>`<div class="v89state">${x}</div>`).join('')}</div>`;if(t==='cooking')c.innerHTML=`<div class="v89grid">${[['Cooking Fundamentals','ALASKA ICE CRYSTALS • FUTURE COURSE','Kitchen setup, measurements, temperatures, timing, techniques and practical cooking exercises.','#'],['Food Safety','OFFICIAL-SOURCE COURSE TO BUILD','Build from legally reusable FDA/USDA/state food-safety sources; no copied commercial culinary course.','#'],['Truck / Camp / Home Cooking','ORIGINAL PRACTICAL COURSE','Real-world cooking with limited equipment, meal planning, storage, cleanup and safe handling.','#'],['Baking + Recipe Math','ORIGINAL PRACTICAL COURSE','Fractions, scaling recipes, weights/volumes, temperatures, timing and troubleshooting.','#']].map(x=>card(x,'v89ok')).join('')}</div>`;c.querySelectorAll('button[data-url]').forEach(b=>{if(b.dataset.url&&b.dataset.url!=='#')b.onclick=()=>window.open(b.dataset.url,'_blank')});}d.getElementById('v89open').onclick=()=>{d.getElementById('v89ov').classList.add('open');show('federal')};d.getElementById('v89close').onclick=()=>d.getElementById('v89ov').classList.remove('open');d.querySelectorAll('.v89tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));show('federal');const hud=d.querySelector('.hud>div:first-child');if(hud)hud.innerHTML='<strong>V89 • FEDERAL TRAINING CORE + RIGHTS LEDGER</strong>V88 preserved • restricted/unclear manuals are no longer imported';const status=d.querySelector('.status');if(status)status.textContent='V89 LOCKS THE DO-NOT-COPY RULE, ADDS THE FEDERAL CDL/ELDT REGULATORY CORE, CREATES A LAWYER/PERMISSION LEDGER, AND OPENS THE FUTURE COOKING DEPARTMENT. V88 AND EARLIER BUILDS REMAIN SAFE.';}f.addEventListener('load',()=>setTimeout(install,1000));setTimeout(install,1700);setInterval(()=>{if(!done)install()},900)})();</script></body></html>
