const regions={ak:{title:'ALASKA TRAINING MAP',source:'U.S. public/open geographic data foundation. Alaska-specific trucking layers will be imported into this OSKO presentation.',cards:[['ALASKA FREIGHT CORRIDORS','Anchorage • Fairbanks • Glennallen • Tok • Delta Junction • Prudhoe Bay training network.'],['WINTER / MOUNTAIN LESSONS','Snow, ice, grades, chain-up decisions, low traction, remote-road planning.'],['ALASKA HOS MODE','Select Alaska rule set for applicable intrastate lessons and federal rules when applicable.'],['CANADA CONNECTION','Training routes can continue southeast into Yukon/Canada without changing training systems.']],land:'ak'},ca:{title:'CANADA TRAINING MAP',source:'Canada Open Government road-network foundation. OSKO styling and training layers remain our own presentation.',cards:[['ALASKA–CANADA CORRIDOR','Yukon and British Columbia training connections for Alaska-to-Lower-48 trips.'],['TRANS-CANADA TRAINING','Long-haul trip planning, fuel, weather, mountain and border scenarios.'],['BORDER PROCEDURES','Training checkpoints for documents, route planning, inspection and crossing procedures.'],['REMOTE / FERRY LAYERS','Future road, ferry, remote-service and winter-condition data layers.']],land:'ca'},l48:{title:'LOWER 48 TRAINING MAP',source:'U.S. Census TIGER/Line and other public/open U.S. transportation datasets can feed this OSKO-rendered training atlas.',cards:[['NATIONAL FREIGHT NETWORK','Major north/south and east/west corridors for long-haul student lessons.'],['REGIONAL LESSONS','West Coast • Mountain West • Midwest • South • Northeast training zones.'],['TRIP PLANNING','Mileage, fuel, rest stops, scales, mountains, cities and delivery windows.'],['HOS + ELD INTEGRATION','Federal HOS clock and training ELD can follow the student across the route.']],land:'l48'}};
function road(x,y,w,a,cls=''){return `<div class="v85road ${cls}" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${a}deg)"></div>`}function node(x,y,n){return `<div class="v85node" style="left:${x}px;top:${y}px"><div class="v85label">${n}</div></div>`}function rlabel(x,y,n){return `<div class="v85routeLabel" style="left:${x}px;top:${y}px">${n}</div>`}
function draw(r){let h='';if(r==='ak'){h+=`<div class="v85land" style="left:220px;top:95px;width:900px;height:700px;border-radius:47% 34% 45% 38%/38% 48% 35% 48%;transform:rotate(-7deg)"></div>`;h+=road(490,580,340,-58,'winter')+road(690,390,330,-34,'interstate')+road(820,210,380,73,'winter')+road(560,600,290,8,'interstate')+road(370,610,220,-16,'interstate');h+=node(510,610,'Anchorage')+node(700,455,'Glennallen')+node(800,390,'Tok')+node(900,255,'Fairbanks')+node(1035,135,'Prudhoe Bay')+node(760,580,'Valdez');h+=rlabel(620,430,'AK-1 / GLENN')+rlabel(800,320,'ALCAN')+rlabel(970,220,'DALTON')+rlabel(580,625,'PARKS / SEWARD');}

function setRegion(r){document.querySelectorAll('.v85tabs button').forEach(b=>b.classList.toggle('active',b.dataset.r===r));const q=regions[r];status.textContent=q.title;source.textContent=q.source;panel.innerHTML=q.cards.map((c,i)=>`<div class="v85card"><h3>${c[0]}</h3><div>${c[1]}</div><button class="v85lesson" data-i="${i}">START TRAINING LESSON</button></div>`).join('');draw(r);panel.querySelectorAll('.v85lesson').forEach((b,i)=>b.onclick=()=>alert(q.cards[i][0]+' — lesson slot is connected. Next passes will attach live route rules, mileage, HOS clocks, weather, scales, fuel and simulator scoring.'));resetView();}
let x=0,y=0,z=.72,drag=false,sx=0,sy=0,bx=0,by=0;const pts=new Map();let pd=0,pz=z;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function render(){map.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${z})`}function resetView(){x=0;y=0;z=.72;render()}function dist(){const p=[...pts.values()];return p.length<2?0:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)}wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture?.(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){drag=true;sx=e.clientX;sy=e.clientY;bx=x;by=y}else if(pts.size===2){pd=dist();pz=z;drag=false}});wrap.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>=2){const dd=dist();if(pd)z=clamp(pz*(dd/pd),.35,2.2);render()}else if(drag){x=bx+e.clientX-sx;y=by+e.clientY-sy;render()}});function up(e){pts.delete(e.pointerId);if(!pts.size)drag=false;if(pts.size===1){const p=[...pts.values()][0];sx=p.x;sy=p.y;bx=x;by=y;drag=true}}wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);d.getElementById('v85plus').onclick=()=>{z=clamp(z*1.2,.35,2.2);render()};d.getElementById('v85minus').onclick=()=>{z=clamp(z/1.2,.35,2.2);render()};d.getElementById('v85reset').onclick=resetView;d.getElementById('v85open').onclick=()=>{overlay.classList.add('open');setRegion('ak')};d.getElementById('v85close').onclick=()=>overlay.classList.remove('open');d.querySelectorAll('.v85tabs button').forEach(b=>b.onclick=()=>setRegion(b.dataset.r));setRegion('ak');
