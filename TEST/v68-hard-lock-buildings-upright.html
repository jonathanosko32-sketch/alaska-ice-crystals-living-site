<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alaska Ice Crystals V68</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d}#base{width:100vw;height:100vh;border:0}#status{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;text-align:center;pointer-events:none}#status span{display:inline-block;padding:10px 14px;border-radius:15px;background:#061b25ee;border:1px solid #69cbd7;color:#fff;font:800 12px system-ui}</style></head><body><iframe id="base" src="v67-buildings-stay-upright.html?v=68"></iframe><div id="status"><span>V68 • BUILDINGS HARD-LOCKED UPRIGHT • V67 SAFE</span></div><script>(()=>{const outer=document.getElementById('base');let installed=false,heading=0;function chain(){let d;try{d=outer.contentDocument}catch(e){return null}let rotDoc=null,worldDoc=null,w=null;for(let i=0;i<56&&d;i++){if(d.getElementById('ccw')&&d.getElementById('cw'))rotDoc=d;if(d.getElementById('worldWindow')){worldDoc=d;w=d.getElementById('worldWindow')}const f=d.getElementById('base');if(!f)break;try{d=f.contentDocument}catch(e){break}}return rotDoc&&worldDoc&&w?{rotDoc,worldDoc,w}:null}function getBuildings(worldDoc){const selectors=['.booth','.v58b','.v59b','.v59cell','.v63stall','.v64building','.v66shop','.building','[data-name]'];const all=[...new Set(selectors.flatMap(s=>[...worldDoc.querySelectorAll(s)]))];return all.filter(el=>el.closest('.v53c'))}function lock(worldDoc){getBuildings(worldDoc).forEach(el=>{el.style.setProperty('transform-origin','50% 50%','important');el.style.setProperty('transform',`rotate(${heading}deg)`,'important');el.style.setProperty('rotate','0deg','important');el.style.setProperty('backface-visibility','hidden','important')})}function apply(x){x.w.style.transformOrigin='50% 50%';x.w.style.transform=`rotate(${-heading}deg)`;x.w.style.transition='transform .12s ease-out';lock(x.worldDoc);requestAnimationFrame(()=>lock(x.worldDoc));setTimeout(()=>lock(x.worldDoc),80);setTimeout(()=>lock(x.worldDoc),180)}function install(){if(installed)return;const x=chain();if(!x)return setTimeout(install,350);installed=true;const {rotDoc,worldDoc}=x;['ccw','cw','reset'].forEach(id=>{const b=rotDoc.getElementById(id);if(b)b.replaceWith(b.cloneNode(true))});const left=rotDoc.getElementById('ccw'),right=rotDoc.getElementById('cw'),reset=rotDoc.getElementById('reset');left&&left.addEventListener('click',()=>{heading=(heading-15+360)%360;apply(x)});right&&right.addEventListener('click',()=>{heading=(heading+15)%360;apply(x)});reset&&reset.addEventListener('click',()=>{heading=0;apply(x)});apply(x);setInterval(()=>lock(worldDoc),250);const hud=worldDoc.querySelector('.hud .card:first-child');if(hud)hud.innerHTML='<strong>LIVING WORLD V68</strong>World turns • carnival buildings hard-locked upright';const stamp=worldDoc.querySelector('.stamp');if(stamp)stamp.textContent='V68 • V67 PRESERVED • BUILDING ORIENTATION HARD-LOCKED TO VIEWER • WORLD TURNING PRESERVED • TEST'}outer.addEventListener('load',()=>setTimeout(install,5800));setTimeout(install,7200);setInterval(()=>{if(!installed)install()},1000)})();</script></body></html>
