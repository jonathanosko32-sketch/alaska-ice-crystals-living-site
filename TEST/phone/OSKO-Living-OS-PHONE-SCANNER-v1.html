<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020910"><title>SKIE Scanner</title><style>
html,body{margin:0;height:100%;background:#020910;color:#eaffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}.wrap{height:100%;display:flex;flex-direction:column}.top{padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:#071722;border-bottom:1px solid #24495d;display:flex;gap:8px;align-items:center}.title{font-weight:800;flex:1}.btn{border:0;border-radius:10px;padding:10px 12px;background:#15394c;color:#eaffff;font-weight:800}.stage{position:relative;flex:1;background:#000;min-height:0}video{width:100%;height:100%;object-fit:cover}.aim{position:absolute;left:12%;right:12%;top:32%;height:34%;border:2px solid rgba(152,235,255,.85);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}.status{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(3,16,24,.84);border:1px solid #2c617a;border-radius:14px;padding:10px;font-size:13px}.result{font-weight:800;word-break:break-all}.foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;background:#071722}.foot .btn{flex:1}.warn{color:#ffd7a5;font-size:11px;margin-top:5px}</style></head><body><div class="wrap"><div class="top"><div class="title">SKIE • PHONE SCANNER</div><button class="btn" id="close">CLOSE</button></div><div class="stage"><video id="video" playsinline muted></video><div class="aim"></div><div class="status"><div id="state">Starting camera…</div><div class="result" id="result"></div><div class="warn" id="note">Scan UPC/EAN, QR, Data Matrix and supported codes. Product lookup is a separate online step.</div></div></div><div class="foot"><button class="btn" id="start">START CAMERA</button><button class="btn" id="flash">FLASH</button></div></div>
<script src="../modules/osko-scan-core-v1.js"></script><script>(()=>{'use strict';const video=document.getElementById('video'),state=document.getElementById('state'),result=document.getElementById('result'),core=OSKOScanCore.create({maxHistory:30});let stream=null,detector=null,running=false,last='';
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();if('BarcodeDetector' in window){let formats;try{formats=await BarcodeDetector.getSupportedFormats()}catch(e){}detector=new BarcodeDetector(formats&&formats.length?{formats:formats}:undefined);running=true;state.textContent='Camera ready • point at a code';scanLoop()}else{state.textContent='Camera ready • barcode detector not supported in this browser';document.getElementById('note').textContent='Camera works, but automatic code reading needs browser BarcodeDetector support or the later native Android scanner.'}}catch(e){state.textContent='Camera unavailable';document.getElementById('note').textContent=(e&&e.message)||'Allow camera permission and try again.'}}
async function scanLoop(){if(!running||!detector)return;try{const codes=await detector.detect(video);if(codes&&codes[0]){const key=(codes[0].format||'')+'|'+(codes[0].rawValue||'');if(key!==last){last=key;const out=core.accept(codes[0],'phone-camera');if(out.ok){result.textContent=out.result.rawValue+' • '+out.result.format;state.textContent='Scanned';localStorage.setItem('osko-last-scan',JSON.stringify(out.result));if(window.parent&&window.parent!==window)window.parent.postMessage({type:'OSKO_SCAN_RESULT',payload:out.result},location.origin);if(navigator.vibrate)navigator.vibrate(60)}}}}catch(e){}requestAnimationFrame(scanLoop)}
document.getElementById('start').onclick=start;document.getElementById('close').onclick=()=>{running=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(window.parent&&window.parent!==window)window.parent.postMessage({type:'OSKO_SCAN_CLOSE'},location.origin);else history.back()};document.getElementById('flash').onclick=async()=>{try{const t=stream&&stream.getVideoTracks()[0],caps=t&&t.getCapabilities&&t.getCapabilities();if(!caps||!caps.torch){state.textContent='Flash control not available';return}const s=t.getSettings();await t.applyConstraints({advanced:[{torch:!s.torch}]});state.textContent='Flash toggled'}catch(e){state.textContent='Flash control unavailable'}};start();})();</script></body></html>
