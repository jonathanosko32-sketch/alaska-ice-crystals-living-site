<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06131c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><title>OSKO Living OS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020910;color:#effcff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#world{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020910}.bar{position:fixed;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));z-index:20;display:flex;gap:7px;align-items:center;padding:8px 9px;border:1px solid rgba(120,220,255,.28);background:rgba(2,13,21,.78);backdrop-filter:blur(10px);border-radius:15px;box-shadow:0 8px 30px rgba(0,0,0,.24)}.brand{font-weight:800;letter-spacing:.08em;font-size:12px;white-space:nowrap}.state{font-size:10px;color:#93cfe5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.btn{border:0;border-radius:10px;padding:9px 10px;background:#123145;color:#eaffff;font-weight:750;font-size:11px}.btn.hot{background:#1b5b78}.panel{position:fixed;left:10px;right:10px;top:64px;z-index:30;background:#071722;border:1px solid #29536a;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none}.panel.show{display:block}.panel h2{font-size:16px;margin:0 0 7px}.panel p{font-size:12px;color:#afd7e5;margin:6px 0 12px;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:10px;color:#7099aa;margin-top:9px}.hide{display:none!important}
</style></head><body>
<iframe id="world" title="OSKO Living OS"></iframe>
<div class="bar"><div class="brand">OSKO</div><div class="state" id="state">Starting phone shell…</div><button class="btn" id="installBtn">INSTALL</button><button class="btn" id="updatesBtn">UPDATES</button></div>
<div class="panel" id="panel"><h2 id="panelTitle">Updates</h2><p id="panelText">Checking release channel…</p><div class="row"><button class="btn hot" id="applyBtn">APPLY UPDATE</button><button class="btn" id="stableBtn">USE STABLE</button><button class="btn" id="closeBtn">CLOSE</button></div><div class="note" id="panelNote"></div></div>
<script>
(()=>{
'use strict';
const RELEASES='./releases.json';
const FALLBACK='../OSKO-Living-OS-FIRST-BUILD-v1-FIX8.html';
const world=document.getElementById('world'),stateEl=document.getElementById('state'),panel=document.getElementById('panel'),panelText=document.getElementById('panelText'),panelNote=document.getElementById('panelNote'),installBtn=document.getElementById('installBtn');
let manifest=null,deferredInstall=null;
const saved=JSON.parse(localStorage.getItem('osko-phone-release')||'null');
function load(url,label){world.src=url||FALLBACK;stateEl.textContent='RUNNING • '+(label||'STABLE');}
async function releases(){
 try{const r=await fetch(RELEASES+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('release file unavailable');manifest=await r.json();return manifest}catch(e){stateEl.textContent='OFFLINE • LAST KNOWN RELEASE';return null}
}
function current(){return JSON.parse(localStorage.getItem('osko-phone-release')||'null')}
function saveRelease(r){localStorage.setItem('osko-phone-release',JSON.stringify(r));load(r.url,r.label||r.id)}
async function check(showPanel){
 const m=await releases();if(!m)return;
 const c=current();const stable=m.stable;const candidate=m.candidate;
 if(!c){saveRelease(stable)}
 const active=current()||stable;
 stateEl.textContent='RUNNING • '+(active.label||active.id);
 const newer=candidate&&candidate.enabled&&candidate.id!==active.id;
 panelText.textContent=newer?'Update available: '+candidate.label:'No newer approved candidate is staged.';
 panelNote.textContent='Installed shell stays on your phone. Living OS releases change through this update channel. Stable rollback remains available.';
 document.getElementById('applyBtn').disabled=!newer;
 if(showPanel)panel.classList.add('show');
}
document.getElementById('updatesBtn').onclick=()=>check(true);
document.getElementById('closeBtn').onclick=()=>panel.classList.remove('show');
document.getElementById('applyBtn').onclick=()=>{if(manifest&&manifest.candidate&&manifest.candidate.enabled){saveRelease(manifest.candidate);panel.classList.remove('show')}};
document.getElementById('stableBtn').onclick=()=>{if(manifest&&manifest.stable){saveRelease(manifest.stable);panel.classList.remove('show')}else{saveRelease({id:'FIX8',label:'FIX8 STABLE',url:FALLBACK})}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.classList.add('hot');stateEl.textContent='READY TO ADD TO PHONE'});
installBtn.onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installBtn.classList.remove('hot')}else{panel.classList.add('show');panelText.textContent='Use your browser menu and choose Add to Home screen / Install app if the install prompt is not shown.';panelNote.textContent='This installs the phone shell. Future Living OS changes can then come through UPDATES.'}};
window.addEventListener('appinstalled',()=>{stateEl.textContent='INSTALLED • OSKO LIVING OS';installBtn.classList.add('hide')});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
if(saved)load(saved.url,saved.label||saved.id);else load(FALLBACK,'FIX8 STABLE');
check(false);setInterval(()=>check(false),15*60*1000);
})();
</script></body></html>
