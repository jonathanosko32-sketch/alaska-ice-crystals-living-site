<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06131c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest-v6.webmanifest"><title>OSKO Living OS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020910;color:#effcff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#world{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020910}.bar{position:fixed;left:8px;right:8px;top:max(6px,env(safe-area-inset-top));z-index:20;display:flex;gap:5px;align-items:center;padding:7px;border:1px solid rgba(120,220,255,.24);background:rgba(2,13,21,.82);backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.22);transition:.18s ease}.bar.compact{right:auto}.bar.compact .state,.bar.compact .optional{display:none}.brand{font-weight:800;letter-spacing:.08em;font-size:12px;white-space:nowrap}.state{font-size:10px;color:#93cfe5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.btn{border:0;border-radius:10px;padding:9px 9px;background:#123145;color:#eaffff;font-weight:750;font-size:10px}.btn.hot{background:#1b5b78}.btn.warn{background:#6f3f1c}.btn.good{background:#1f654b}.panel{position:fixed;left:10px;right:10px;top:64px;z-index:30;background:#071722;border:1px solid #29536a;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none}.panel.show{display:block}.panel h2{font-size:16px;margin:0 0 7px}.panel p{font-size:12px;color:#afd7e5;margin:6px 0 12px;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:10px;color:#7099aa;margin-top:9px}.hide{display:none!important}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#102b3a;color:#a9e9ff;font-size:10px;margin-bottom:7px}#scanLayer{position:fixed;inset:0;z-index:100;background:#020910;display:none}#scanLayer.show{display:block}#scanFrame{width:100%;height:100%;border:0}.scanToast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(3,18,28,.9);border:1px solid #2f718b;border-radius:12px;padding:8px 12px;font-size:11px;display:none;max-width:86%;word-break:break-all}.scanToast.show{display:block}
</style><style>
@media(max-width:759px){.bar{gap:7px;padding:9px;flex-wrap:wrap}.state{order:3;flex-basis:100%;font-size:13px;padding:3px 4px}.btn{min-height:46px;padding:10px 13px;font-size:13px}.panel{top:118px;padding:18px}.panel h2{font-size:22px}.panel p{font-size:16px}.note{font-size:13px;line-height:1.4}.badge{font-size:12px;padding:6px 9px}.row{gap:10px}}
</style></head><body>
<iframe id="world" title="OSKO Living OS"></iframe>
<div class="bar" id="bar"><button class="btn" id="compactBtn">OSKO</button><div class="state" id="state">Starting phone shell…</div><button class="btn good optional" id="runBtn">RUN OS</button><button class="btn optional" id="installBtn">INSTALL</button><button class="btn optional" id="scanBtn">SCAN</button><button class="btn hot optional" id="updatesBtn">UPDATES</button></div>
<div class="panel" id="panel"><div class="badge" id="modeBadge">PHONE HOST</div><h2 id="panelTitle">Living OS Phone Host</h2><p id="panelText">Starting…</p><div class="row" id="normalRow"><button class="btn hot" id="testBtn">TEST UPDATE</button><button class="btn" id="rollbackBtn">ROLL BACK</button><button class="btn" id="stableBtn">USE FIX8</button><button class="btn" id="closeBtn">CLOSE</button></div><div class="row hide" id="testRow"><button class="btn good" id="keepBtn">KEEP UPDATE</button><button class="btn warn" id="rejectBtn">REJECT UPDATE</button></div><div class="note" id="panelNote"></div></div>
<div id="scanLayer"><iframe id="scanFrame" title="SKIE scanner" allow="camera"></iframe></div><div id="scanToast" class="scanToast"></div>
<script src="./osko-phone-update-client-v1.js"></script><script src="./osko-phone-host-bridge-v1.js"></script>
<script>
(()=>{'use strict';
const RELEASES='./releases-v3.json',FALLBACK='../OSKO-Living-OS-FIRST-BUILD-v1-FIX8.html';
const world=document.getElementById('world'),bar=document.getElementById('bar'),stateEl=document.getElementById('state'),panel=document.getElementById('panel'),panelText=document.getElementById('panelText'),panelNote=document.getElementById('panelNote'),installBtn=document.getElementById('installBtn'),runBtn=document.getElementById('runBtn'),normalRow=document.getElementById('normalRow'),testRow=document.getElementById('testRow'),modeBadge=document.getElementById('modeBadge'),scanLayer=document.getElementById('scanLayer'),scanFrame=document.getElementById('scanFrame'),scanToast=document.getElementById('scanToast');
const updates=OSKOPhoneUpdateClient.create({storage:localStorage}),host=OSKOPhoneHostBridge.create({storage:localStorage});let registry=null,deferredInstall=null,currentLabel='FIX8 STABLE';
function show(url,label,testMode){currentLabel=label||'FIX8 STABLE';world.src=url||FALLBACK;stateEl.textContent=(testMode?'TESTING • ':'RUNNING • ')+currentLabel;modeBadge.textContent=testMode?'TEST MODE — NOT ACTIVE':'PHONE HOST'}
async function fetchRegistry(){try{const r=await fetch(RELEASES+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('release registry unavailable');const data=await r.json(),valid=updates.validateRegistry(data);if(!valid.ok)throw new Error(valid.error);registry=data;updates.bootstrap(data.stable);return data}catch(e){stateEl.textContent='OFFLINE • USING SAVED RELEASE';return null}}
function renderState(){const s=updates.status();if(s.testing&&s.staged){show(s.staged.url,s.staged.label,true);normalRow.classList.add('hide');testRow.classList.remove('hide');panelText.textContent='You are testing '+s.staged.label+'. Tap KEEP UPDATE only after it works correctly on this phone.';panelNote.textContent='REJECT UPDATE returns to the active release. FIX8 remains protected.';return}normalRow.classList.remove('hide');testRow.classList.add('hide');const active=s.active||(registry&&registry.stable)||{url:FALLBACK,label:'FIX8 STABLE'};show(active.url,active.label,false);const cand=registry&&registry.candidate&&registry.candidate.enabled?registry.candidate:null,available=cand&&cand.id!==active.id;document.getElementById('testBtn').disabled=!available;document.getElementById('rollbackBtn').disabled=!s.previous;panelText.textContent=available?'Update ready to test: '+cand.label:'Living OS phone host is ready.';panelNote.textContent='Current: '+(active.label||active.id)+(s.previous?' • Previous: '+(s.previous.label||s.previous.id):'')+'. FIX8 remains protected.'}
async function check(open){await fetchRegistry();renderState();if(open)panel.classList.add('show')}
function hostStatus(s){const parts=[];parts.push(s.standalone?'INSTALLED':'BROWSER');parts.push(s.online?'ONLINE':'OFFLINE');if(s.fullscreen)parts.push('FULLSCREEN');if(s.wakeLock)parts.push('AWAKE');runBtn.textContent=(s.fullscreen||s.standalone)?'OS RUNNING':'RUN OS';if(!updates.status().testing)stateEl.textContent=parts.join(' • ')+' • '+currentLabel}
host.onChange(hostStatus);hostStatus(host.status());
document.getElementById('compactBtn').onclick=()=>bar.classList.toggle('compact');runBtn.onclick=async()=>{const s=host.status();if(s.fullscreen&&!s.standalone){await host.releaseRunMode()}else{await host.requestRunMode()}hostStatus(host.status())};
document.getElementById('updatesBtn').onclick=()=>check(true);document.getElementById('closeBtn').onclick=()=>panel.classList.remove('show');document.getElementById('testBtn').onclick=()=>{if(registry&&registry.candidate){updates.stage(registry.candidate);renderState()}};document.getElementById('keepBtn').onclick=()=>{const out=updates.confirmAndActivate();if(out.ok){renderState();panelText.textContent='Update confirmed on this phone and activated.'}};document.getElementById('rejectBtn').onclick=()=>{updates.reject('owner-rejected-after-phone-test');renderState();panelText.textContent='Candidate rejected. Returned to the active release.'};document.getElementById('rollbackBtn').onclick=()=>{updates.rollback(registry&&registry.stable);renderState();panelText.textContent='Rolled back to the previous known-good release.'};document.getElementById('stableBtn').onclick=()=>{updates.useStable((registry&&registry.stable)||{id:'FIX8',label:'FIX8 STABLE',url:FALLBACK,protected:true});renderState();panelText.textContent='Protected FIX8 selected.'};
document.getElementById('scanBtn').onclick=()=>{scanFrame.src='./OSKO-Living-OS-PHONE-SCANNER-v1.html';scanLayer.classList.add('show')};window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;if(e.data.type==='OSKO_SCAN_CLOSE'){scanLayer.classList.remove('show');scanFrame.src='about:blank'}if(e.data.type==='OSKO_SCAN_RESULT'&&e.data.payload){const r=e.data.payload;localStorage.setItem('osko-last-scan',JSON.stringify(r));scanToast.textContent='SKIE SCANNED • '+r.rawValue;scanToast.classList.add('show');setTimeout(()=>scanToast.classList.remove('show'),3500);try{world.contentWindow.postMessage({type:'OSKO_SCAN_RESULT',payload:r},location.origin)}catch(_){}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.classList.add('hot');stateEl.textContent='READY TO ADD TO PHONE'});installBtn.onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installBtn.classList.remove('hot')}else{panel.classList.add('show');panelText.textContent='Use the browser menu and choose Install app / Add to Home screen if no install prompt appears.';panelNote.textContent='After installation, open OSKO from the phone like an app. RUN OS can request fullscreen while using the browser version.'}};window.addEventListener('appinstalled',()=>{stateEl.textContent='INSTALLED • OSKO LIVING OS';installBtn.classList.add('hide');hostStatus(host.status())});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw-v6.js').catch(()=>{})}renderState();check(false);setInterval(()=>check(false),60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(false)});
})();
</script></body></html>
