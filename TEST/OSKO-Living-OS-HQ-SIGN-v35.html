    const patch=`

src=src.replace("const bulb=new THREE.Mesh(new THREE.SphereGeometry(.42,8,6),bulbMat);bulb.position.set(x+dx,4.5,z+5.8);scene.add(bulb);a.push(bulb)", "const bulb=new THREE.Mesh(new THREE.SphereGeometry(.46,10,8),bulbMat);bulb.position.set(x+dx,4.5,z+5.8);scene.add(bulb);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.62,.48,.24,10),new THREE.MeshStandardMaterial({color:0x16242d,metalness:.72,roughness:.28}));cap.position.set(x+dx,4.85,z+5.8);scene.add(cap);a.push(bulb)");

src=src.replace("w.material.opacity=on?.84:.22", "w.material.opacity=on?.9:.18;w.material.transparent=true");
src=src.replace("sg.material.emissiveIntensity=6.5", "sg.material.emissiveIntensity=7.4");
src=src.replace("new THREE.PointLight(0x69e4ff,5.2,46,2)", "new THREE.PointLight(0x69e4ff,6.0,52,2)");

// HQ ONLY: keep the existing Alaska Ice Crystals calligraphy wording/font family,
// change the sign face to deep OSKO ocean blue, lettering to crystal turquoise,
// and give the lettering a separate emissive/backlit layer so it reads as raised.
const hqOld="sg.material.color.setHex(0xffffff);if(sg.material.emissive)sg.material.emissive.setHex(0x6be8ff);sg.material.emissiveIntensity=7.4;sg.material.roughness=.16}const halo=";

if(!src.includes(hqOld))throw new Error('HQ sign patch point missing');
src=src.replace(hqOld,hqNew);

src=src.replace("READY • WORLD DEVELOPMENT v33 • ARCHITECTURAL LIGHTING • v31 CONTROLS PRESERVED","READY • HQ SIGN TEST v35 • HQ CALLIGRAPHY + OCEAN BLUE + TURQUOISE BACKLIGHT");
`;
    if(!src.includes(marker))throw new Error('v33 launch point missing');
    src=src.replace(marker,patch+'\n'+marker);
    document.open();document.write(src);document.close();
