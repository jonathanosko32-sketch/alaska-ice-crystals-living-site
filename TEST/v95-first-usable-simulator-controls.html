<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03131d"><title>Alaska Ice Crystals V95 — First Usable Simulator Controls</title><style>html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#03131d}#base{width:100vw;height:100dvh;border:0;display:block}</style></head><body><iframe id="base" src="v94-school-simulator-visual-walkthrough.html?v=95-base"></iframe><script>(()=>{const f=document.getElementById('base');let done=false;function install(){if(done)return;let d;try{d=f.contentDocument}catch(e){return setTimeout(install,350)}if(!d)return setTimeout(install,350);const expansion=d.querySelector('.expansion');if(!expansion)return setTimeout(install,450);done=true;const s=d.createElement('style');s.textContent=`.v95btn{position:absolute;left:5250px;top:13730px;width:1450px;height:410px;z-index:64;border:16px solid #89f1ad;border-radius:46px;background:linear-gradient(135deg,#123d2a,#1e7c4b);color:#fff;font:1000 29px/1.25 system-ui;box-shadow:0 18px 42px #0006}.v95btn small{display:block;font:800 16px/1.35 system-ui;margin-top:10px;color:#edfff2}.v95ov{position:fixed;inset:0;z-index:39000;background:#06130cfb;color:#fff;font-family:system-ui;display:none;overflow:auto}.v95ov.open{display:block}.v95head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#123d2a;border-bottom:2px solid #89f1ad}.v95head strong{flex:1;font:1000 16px system-ui}.v95head button{border:2px solid #89f1ad;border-radius:12px;background:#1f6c43;color:#fff;padding:9px 11px;font:900 12px system-ui}.v95wrap{max-width:1100px;margin:0 auto;padding:14px}.v95intro{border:2px solid #75d79a;border-radius:16px;background:#153725;padding:13px;font:800 13px/1.45 system-ui;margin-bottom:12px}.v95dash{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.v95box{border:2px solid #6ebc8c;border-radius:18px;background:#10261a;padding:13px}.v95box h3{margin:0 0 10px;font:1000 15px system-ui}.v95status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v95stat{border:2px solid #557565;border-radius:12px;background:#0b1710;padding:9px;font:900 11px/1.3 system-ui}.v95stat b{display:block;color:#a9f2c3;font-size:14px;margin-top:3px}.v95controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.v95controls button,.v95wide{border:2px solid #88d6a5;border-radius:13px;background:#194f33;color:#fff;padding:12px 8px;font:900 12px system-ui}.v95controls button.on{background:#2d8b58}.v95controls button.warn{border-color:#ffdf76;background:#655215}.v95controls button.stop{border-color:#ff8b8b;background:#722020}.v95pedwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.v95ped{height:115px;border:2px solid #71867a;border-radius:12px;background:#18211b;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.v95fill{height:0;background:#8bd6a4;transition:height .15s}.v95ped span{padding:7px;text-align:center;font:900 10px system-ui;background:#0d130f}.v95geargrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.v95geargrid button{border:2px solid #6f927d;border-radius:10px;background:#17261c;color:#fff;padding:10px 4px;font:900 11px system-ui}.v95geargrid button.on{background:#2f8b57;border-color:#b0f4c8}.v95log{margin-top:10px;min-height:120px;max-height:220px;overflow:auto;border:2px solid #52715f;border-radius:12px;background:#07110b;padding:10px;font:800 11px/1.4 system-ui;white-space:pre-line}.v95step{margin-top:10px;border:2px solid #d6bd6f;border-radius:14px;background:#423818;padding:10px;font:900 12px/1.4 system-ui}.v95note{margin-top:12px;border:2px solid #6fb8d0;border-radius:14px;background:#143244;padding:11px;font:800 11px/1.4 system-ui}@media(max-width:760px){.v95dash{grid-template-columns:1fr}.v95geargrid{grid-template-columns:repeat(4,1fr)}}`;d.head.appendChild(s);expansion.insertAdjacentHTML('beforeend',`<button class="v95btn" id="v95open">FIRST THINGS YOU CAN ACTUALLY USE<small>Start a lesson • switch manual/automatic • select gears • work air-brake controls • press pedals • watch the student status change</small></button>`);d.body.insertAdjacentHTML('beforeend',`<div class="v95ov" id="v95ov"><div class="v95head"><strong>V95 — FIRST USABLE STUDENT SIMULATOR CONTROLS</strong><button id="v95close">CLOSE</button></div><div class="v95wrap"><div class="v95intro">This is the first stage where you can operate parts of the training station instead of only looking at it. It is still not the finished truck-driving physics simulator, but the controls now respond, the lesson state changes, and the school can begin recording what the student does.</div><div class="v95dash"><div class="v95box"><h3>STUDENT #1 — LIVE TRAINING STATION</h3><div class="v95status"><div class="v95stat">Lesson<b id="v95lesson">NOT STARTED</b></div><div class="v95stat">Transmission<b id="v95mode">18-SPEED MANUAL</b></div><div class="v95stat">Selected gear<b id="v95gear">NEUTRAL</b></div><div class="v95stat">Safety state<b id="v95safe">PARKED / SECURED</b></div><div class="v95stat">Tractor parking brake<b id="v95park">SET</b></div><div class="v95stat">Trailer air supply<b id="v95air">OUT / OFF</b></div></div><div class="v95step" id="v95step">NEXT STEP: Tap START LESSON. The station will walk you through the controls one at a time.</div><div class="v95log" id="v95log">Student station ready.</div></div><div class="v95box"><h3>LESSON + MODE CONTROLS</h3><div class="v95controls"><button id="v95start">START LESSON</button><button id="v95reset">RESET STATION</button><button id="v95manual" class="on">18-SPEED MANUAL</button><button id="v95auto">AUTOMATIC</button><button id="v95parkbtn" class="warn">TRACTOR PARK BRAKE: SET</button><button id="v95airbtn" class="stop">TRAILER AIR: OUT</button></div><h3 style="margin-top:14px">PEDALS — PRESS AND HOLD</h3><div class="v95pedwrap"><div class="v95ped" data-ped="clutch"><div class="v95fill" id="v95clutchfill"></div><span>CLUTCH</span></div><div class="v95ped" data-ped="brake"><div class="v95fill" id="v95brakefill"></div><span>BRAKE</span></div><div class="v95ped" data-ped="throttle"><div class="v95fill" id="v95throttlefill"></div><span>THROTTLE</span></div></div></div><div class="v95box"><h3>18-SPEED TRAINING GEAR SELECTOR</h3><div class="v95geargrid" id="v95gears"><button data-g="R">R</button><button data-g="N" class="on">N</button><button data-g="1L">1L</button><button data-g="1H">1H</button><button data-g="2L">2L</button><button data-g="2H">2H</button><button data-g="3L">3L</button><button data-g="3H">3H</button><button data-g="4L">4L</button><button data-g="4H">4H</button><button data-g="5L">5L</button><button data-g="5H">5H</button><button data-g="6L">6L</button><button data-g="6H">6H</button><button data-g="7L">7L</button><button data-g="7H">7H</button><button data-g="8L">8L</button><button data-g="8H">8H</button></div><div class="v95note">This selector teaches the idea of range/split positions first. Later it connects to the physical shifter hardware and real transmission logic. Automatic mode hides the manual-shift requirement but keeps the same braking, mirror, signaling and vehicle-control lessons.</div></div><div class="v95box"><h3>WHAT BECOMES USABLE NEXT</h3><div class="v95status"><div class="v95stat">Steering response<b>NEXT</b></div><div class="v95stat">Turn signals / mirrors<b>NEXT</b></div><div class="v95stat">Air pressure gauges<b>NEXT</b></div><div class="v95stat">Start / shutdown sequence<b>NEXT</b></div><div class="v95stat">Backing movement<b>AFTER CONTROLS</b></div><div class="v95stat">Road driving physics<b>AFTER CONTROLS</b></div></div><div class="v95note">The goal is to let you begin learning inside the school before every advanced simulator feature is finished. We will unlock one working lesson at a time instead of making you wait for the entire school to be complete.</div></div></div></div></div>`);const ov=d.getElementById('v95ov'),log=d.getElementById('v95log'),step=d.getElementById('v95step');let started=false,mode='manual',gear='N',park=true,air=false;function add(t){log.textContent=t+'\n'+log.textContent}function refresh(){d.getElementById('v95mode').textContent=mode==='manual'?'18-SPEED MANUAL':'AUTOMATIC';d.getElementById('v95gear').textContent=mode==='manual'?(gear==='N'?'NEUTRAL':gear):'D / AUTO';d.getElementById('v95park').textContent=park?'SET':'RELEASED';d.getElementById('v95air').textContent=air?'IN / SUPPLY':'OUT / OFF';d.getElementById('v95safe').textContent=park?'PARKED / SECURED':(air?'READY TO MOVE':'BRAKE SYSTEM NOT READY');d.getElementById('v95parkbtn').textContent='TRACTOR PARK BRAKE: '+(park?'SET':'RELEASED');d.getElementById('v95airbtn').textContent='TRAILER AIR: '+(air?'IN':'OUT');d.getElementById('v95parkbtn').classList.toggle('on',!park);d.getElementById('v95airbtn').classList.toggle('on',air)}d.getElementById('v95open').onclick=()=>ov.classList.add('open');d.getElementById('v95close').onclick=()=>ov.classList.remove('open');d.getElementById('v95start').onclick=()=>{started=true;d.getElementById('v95lesson').textContent='CONTROL FAMILIARIZATION';step.textContent='NEXT STEP: Check that tractor parking brake is SET and trailer air is OUT. Then try the clutch, brake and throttle pedals.';add('Lesson started: Control Familiarization.')};d.getElementById('v95reset').onclick=()=>{started=false;mode='manual';gear='N';park=true;air=false;d.getElementById('v95lesson').textContent='NOT STARTED';step.textContent='NEXT STEP: Tap START LESSON. The station will walk you through the controls one at a time.';d.querySelectorAll('#v95gears button').forEach(x=>x.classList.toggle('on',x.dataset.g==='N'));d.getElementById('v95manual').classList.add('on');d.getElementById('v95auto').classList.remove('on');log.textContent='Student station reset.';refresh()};d.getElementById('v95manual').onclick=()=>{mode='manual';d.getElementById('v95manual').classList.add('on');d.getElementById('v95auto').classList.remove('on');add('Transmission lesson mode: 18-speed manual.');refresh()};d.getElementById('v95auto').onclick=()=>{mode='auto';d.getElementById('v95auto').classList.add('on');d.getElementById('v95manual').classList.remove('on');add('Transmission lesson mode: automatic.');refresh()};d.getElementById('v95parkbtn').onclick=()=>{park=!park;add('Tractor parking brake '+(park?'set.':'released.'));if(started&&!park&&!air)step.textContent='WARNING: Trailer air supply is still OUT. Put the trailer air supply IN before a movement lesson.';refresh()};d.getElementById('v95airbtn').onclick=()=>{air=!air;add('Trailer air supply '+(air?'pushed IN.':'pulled OUT.'));if(started&&air&&park)step.textContent='GOOD. Air supply is IN while tractor parking brake remains SET. Next we will add air gauges and a proper brake-system check.';refresh()};d.querySelectorAll('#v95gears button').forEach(b=>b.onclick=()=>{if(mode!=='manual'){add('Manual gear selection ignored because station is in AUTOMATIC mode.');return}gear=b.dataset.g;d.querySelectorAll('#v95gears button').forEach(x=>x.classList.remove('on'));b.classList.add('on');add('Gear selector moved to '+gear+'.');refresh()});d.querySelectorAll('.v95ped').forEach(p=>{const name=p.dataset.ped,fill=d.getElementById('v95'+name+'fill');const down=e=>{e.preventDefault();fill.style.height='100%';add(name.toUpperCase()+' pedal pressed.');if(started)step.textContent='GOOD. '+name.toUpperCase()+' input detected. Release it and try the other controls.'};const up=e=>{e.preventDefault();fill.style.height='0%'};p.addEventListener('pointerdown',down);p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);p.addEventListener('pointerleave',up)});refresh();const hud=d.querySelector('.hud>div:first-child');if(hud)hud.innerHTML='<strong>V95 • FIRST USABLE SIMULATOR CONTROLS</strong>V94 preserved • Student #1 can now operate training controls';const status=d.querySelector('.status');if(status)status.textContent='V95 IS THE FIRST HANDS-ON STUDENT PASS: START A LESSON, SWITCH MANUAL/AUTOMATIC, SELECT TRAINING GEARS, OPERATE TRACTOR/TRAILER AIR-BRAKE CONTROLS, PRESS PEDALS, AND WATCH THE LESSON/SAFETY STATUS RESPOND. V94 AND EARLIER BUILDS REMAIN SAFE.';}f.addEventListener('load',()=>setTimeout(install,1000));setTimeout(install,1700);setInterval(()=>{if(!done)install()},900)})();</script></body></html>
