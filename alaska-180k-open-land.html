d><body><div class="shell"><div class="hud"><div class="card"><strong>ALASKA ICE CRYSTALS</strong>OPEN LAND BUILD</div><div class="card" id="position">X 90000 • Y 90000 • ZOOM 10% • WORLD 180000 × 180000</div></div><div class="window" id="worldWindow"><div class="plane" id="worldPlane"><div class="ocean-left" id="leftOcean"></div><div class="game-overlay" id="gameOverlay"></div><div class="edge north">NORTH EDGE</div><div class="edge south">SOUTH EDGE</div><div class="edge west">WEST EDGE</div><div class="edge east">EAST EDGE</div><div class="boundary-tree tree-nw"></div><div class="boundary-tree tree-ne"></div><div class="boundary-tree tree-sw"></div><div class="boundary-tree tree-se"></div><div class="boundary-tree tree-n"></div><div class="boundary-tree tree-s"></div><div class="boundary-tree tree-w"></div><div class="boundary-tree tree-e"></div><div class="center-tree"></div><div class="boundary-label">180,000 × 180,000 ACTIVE BOUNDARY</div></div></div><div class="help">ONE FINGER MOVE • TWO FINGERS ZOOM</div><div class="stamp">180,000 × 180,000 • CENTER TREE • OCEAN • RIVER + LAKE + CAMPFIRE • 10%–99% ZOOM</div></div><script src="river-lake-180k.js?v=9"></script><script>(()=>{const win=document.getElementById('worldWindow'),plane=document.getElementById('worldPlane'),readout=document.getElementById('position');const pts=new Map();let WORLD=180000,scale=.10,tx=0,ty=0,drag=null,pinch=null;const SPEED=1.55,MIN=.10,MAX=.99;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function bound(){const sw=plane.offsetWidth*scale,sh=plane.offsetHeight*scale,vw=win.clientWidth,vh=win.clientHeight;tx=clamp(tx,-Math.max(0,(sw-vw)/2),Math.max(0,(sw-vw)/2));ty=clamp(ty,-Math.max(0,(sh-vh)/2),Math.max(0,(sh-vh)/2))}function render(){bound();plane.style.transform=`translate3d(calc(-50% + ${tx}px),calc(-50% + ${ty}px),0) scale(${scale})`;readout.textContent=`X ${Math.round((.5-tx/(plane.offsetWidth*scale))*WORLD)} • Y ${Math.round((.5-ty/(plane.offsetHeight*scale))*WORLD)} • ZOOM ${Math.round(scale*100)}% • WORLD ${WORLD} × ${WORLD}`}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}win.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)drag={x:e.clientX,y:e.clientY,tx,ty};else if(pts.size===2)pinch={d:dist(),s:scale,m:mid(),tx,ty}},{passive:false});win.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&drag){tx=drag.tx+(e.clientX-drag.x)*SPEED;ty=drag.ty+(e.clientY-drag.y)*SPEED;render()}else if(pts.size===2&&pinch){const ratio=dist()/pinch.d;scale=clamp(pinch.s*Math.pow(ratio,ratio<1?1.12:2.4),MIN,MAX);render()}},{passive:false});function end(e){pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];drag={x:a.x,y:a.y,tx,ty}}else{drag=null;pinch=null}}win.addEventListener('pointerup',end);win.addEventListener('pointercancel',end);window.OSKO_WORLD={getSize:()=>WORLD,expandTo:n=>{if(+n>WORLD)WORLD=+n;render();return WORLD},isExpandable:true};render()})();</script></body></html>
