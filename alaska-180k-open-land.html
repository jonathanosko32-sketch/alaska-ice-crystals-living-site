<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Alaska Ice Crystals — 180K Open Land</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#020b14;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#03111d,#071923)}.hud{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{padding:8px 10px;border:1px solid rgba(105,228,241,.45);border-radius:12px;background:rgba(2,18,27,.84);color:#e9fbff;font-size:11px}.card strong{display:block;color:#9ff4fb;font-size:12px}.window{position:absolute;left:0;right:0;top:62px;bottom:42px;overflow:hidden;touch-action:none}.plane{position:absolute;left:50%;top:50%;width:5200px;height:5200px;transform-origin:center;background:linear-gradient(135deg,#aebfbd 0%,#dfe8e5 36%,#b8cbc7 68%,#e2e9e6 100%);border:5px solid rgba(134,239,242,.82);box-shadow:0 0 70px rgba(38,196,203,.12) inset;will-change:transform}.plane:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(48,92,92,.11) 2px,transparent 2px),linear-gradient(90deg,rgba(48,92,92,.11) 2px,transparent 2px);background-size:25% 25%}.plane:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(27deg,rgba(63,81,77,.035) 0 2px,transparent 2px 46px),repeating-linear-gradient(151deg,rgba(255,255,255,.055) 0 1px,transparent 1px 58px)}.edge{position:absolute;z-index:2;color:rgba(20,62,64,.48);font-weight:900;letter-spacing:.08em;font-size:52px;pointer-events:none}.north{top:2%;left:50%;transform:translateX(-50%)}.south{bottom:2%;left:50%;transform:translateX(-50%)}.west{left:2%;top:50%;transform:translateY(-50%) rotate(-90deg)}.east{right:2%;top:50%;transform:translateY(-50%) rotate(90deg)}.stamp{position:fixed;z-index:20;left:50%;bottom:8px;transform:translateX(-50%);color:#d7f8fa;font-size:9px;opacity:.72;white-space:nowrap}.help{position:fixed;z-index:20;left:10px;bottom:10px;color:#d7f8fa;font-size:9px;background:rgba(2,20,28,.82);border:1px solid rgba(104,225,237,.35);border-radius:999px;padding:6px 9px}</style></head><body><div class="shell"><div class="hud"><div class="card"><strong>ALASKA ICE CRYSTALS</strong>OPEN LAND BUILD</div><div class="card" id="position">X 90000 • Y 90000 • ZOOM 23% • WORLD 180000 × 180000</div></div><div class="window" id="worldWindow"><div class="plane" id="worldPlane"><div class="edge north">NORTH EDGE</div><div class="edge south">SOUTH EDGE</div><div class="edge west">WEST EDGE</div><div class="edge east">EAST EDGE</div></div></div><div class="help">ONE FINGER MOVE • TWO FINGERS ZOOM</div><div class="stamp">180,000 × 180,000 OPEN LAND • 23%–93% ZOOM • NO OLD 45K CORE</div></div><script>(()=>{const win=document.getElementById('worldWindow'),plane=document.getElementById('worldPlane'),readout=document.getElementById('position');const pts=new Map();let scale=.23,tx=0,ty=0,drag=null,pinch=null;const SPEED=.95,MIN=.23,MAX=.93,ZOOM_IN_POWER=2.4,ZOOM_OUT_POWER=1.12;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function bound(){const sw=plane.offsetWidth*scale,sh=plane.offsetHeight*scale,vw=win.clientWidth,vh=win.clientHeight;const mx=Math.max(0,(sw-vw)/2),my=Math.max(0,(sh-vh)/2);tx=clamp(tx,-mx,mx);ty=clamp(ty,-my,my)}function render(){bound();plane.style.transform=`translate3d(calc(-50% + ${tx}px),calc(-50% + ${ty}px),0) scale(${scale})`;const pw=plane.offsetWidth*scale||1,ph=plane.offsetHeight*scale||1;const nx=clamp(.5-tx/pw,0,1),ny=clamp(.5-ty/ph,0,1);readout.textContent=`X ${Math.round(nx*180000)} • Y ${Math.round(ny*180000)} • ZOOM ${Math.round(scale*100)}% • WORLD 180000 × 180000`}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}win.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{win.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};pinch=null}else if(pts.size===2){pinch={d:dist(),s:scale,m:mid(),tx,ty};drag=null}},{passive:false});win.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&drag){tx=drag.tx+(e.clientX-drag.x)*SPEED;ty=drag.ty+(e.clientY-drag.y)*SPEED;render()}else if(pts.size===2&&pinch){const d=dist();if(!pinch.d)return;const ratioRaw=d/pinch.d,power=ratioRaw<1?ZOOM_OUT_POWER:ZOOM_IN_POWER;const ns=clamp(pinch.s*Math.pow(ratioRaw,power),MIN,MAX);const m=mid(),r=win.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const wx=(pinch.m.x-cx-pinch.tx)/pinch.s,wy=(pinch.m.y-cy-pinch.ty)/pinch.s;tx=(m.x-cx)-wx*ns;ty=(m.y-cy)-wy*ns;scale=ns;render()}},{passive:false});function end(e){pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];drag={x:a.x,y:a.y,tx,ty};pinch=null}else if(!pts.size){drag=null;pinch=null}}win.addEventListener('pointerup',end);win.addEventListener('pointercancel',end);window.addEventListener('resize',render);render()})();</script></body></html>
