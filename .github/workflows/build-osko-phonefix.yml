name: Build OSKO Living Launcher Phone Fix
on:
  push:
    branches: ["launcher-usability-fix", "layover-scene-test", "layover-living-ui-test", "layover-living-motion-v5", "layover-living-motion-v6-final-source", "layover-living-animals-v7-test", "layover-living-life-v8-test", "layover-living-motion-v9-test"]
    paths:
      - "android-launcher-phonefix/**"
      - ".github/workflows/build-osko-phonefix.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v7 animal and app yard patch
        if: github.ref_name == 'layover-living-animals-v7-test' || github.ref_name == 'layover-living-life-v8-test' || github.ref_name == 'layover-living-motion-v9-test'
        working-directory: android-launcher-phonefix
        run: python apply_v7_animals_apps_patch.py
      - name: Apply v8 life patch
        if: github.ref_name == 'layover-living-life-v8-test' || github.ref_name == 'layover-living-motion-v9-test'
        working-directory: android-launcher-phonefix
        run: python apply_v8_life_patch.py
      - name: Apply v9 living motion patch
        if: github.ref_name == 'layover-living-motion-v9-test'
        working-directory: android-launcher-phonefix
        run: python apply_v9_living_motion_patch.py
      - name: Build APK
        working-directory: android-launcher-phonefix
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-launcher-phonefix/app/build/outputs/apk/debug/app-debug.apk OSKO-Living-Launcher-FIXED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OSKO-Living-Launcher-FIXED
          path: OSKO-Living-Launcher-FIXED.apk
      - name: Package APK signer tool
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using $BUILD_TOOLS_DIR"
          tar -czf android-apksigner-tool.tar.gz -C "$BUILD_TOOLS_DIR" apksigner lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ANDROID-APKSIGNER-TOOL
          path: android-apksigner-tool.tar.gz
