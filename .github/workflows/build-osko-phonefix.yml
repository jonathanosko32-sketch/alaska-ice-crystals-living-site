name: Build OSKO Living Launcher Phone Fix
on:
  push:
    branches: ["launcher-usability-fix"]
    paths:
      - "android-launcher-phonefix/**"
      - ".github/workflows/build-osko-phonefix.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android-launcher-phonefix
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-launcher-phonefix/app/build/outputs/apk/debug/app-debug.apk OSKO-Living-Launcher-FIXED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OSKO-Living-Launcher-FIXED
          path: OSKO-Living-Launcher-FIXED.apk
