<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>V12 Part Two Mountain Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e5e3;font-family:Arial,sans-serif}#frame{position:absolute;inset:0;width:100%;height:100%;border:0}.badge{position:fixed;z-index:9999;left:9px;top:9px;background:#4b1f1f;color:#fff;border:3px solid #b85b5b;border-radius:14px;padding:7px 10px;font-size:10px;font-weight:bold}.controls{position:fixed;z-index:9999;right:10px;bottom:12px;display:flex;gap:6px}.controls button{height:48px;min-width:48px;border:3px solid #2e8798;background:#062631;color:#fff;border-radius:15px;font-weight:bold;font-size:20px}.controls .reset{font-size:11px;min-width:72px}.tip{position:fixed;z-index:9998;left:10px;bottom:12px;background:#062631;color:#fff;border:3px solid #2e8798;border-radius:14px;padding:8px 10px;font-size:10px}</style></head><body><iframe id="frame" src="alaska-expanded-build-v10-test.html?v=v12mountain1"></iframe><div class="badge">V12 TEST — PART TWO TERRAIN</div><div class="tip">TEST ONLY • MOVE / ZOOM</div><div class="controls"><button id="minus">−</button><button class="reset" id="reset">RESET</button><button id="plus">+</button></div><script>(()=>{const frame=document.getElementById('frame'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),reset=document.getElementById('reset');const WORLD=2200;let doc,v,w,s=.3,tx=0,ty=0,dragStart=null,pinchStart=null;const pts=new Map();const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function apply(){w.style.left='0';w.style.top='0';w.style.transformOrigin='0 0';w.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`}function fit(){const vw=frame.clientWidth||innerWidth,vh=frame.clientHeight||innerHeight;s=Math.min(vw/WORLD,vh/WORLD)*.94;tx=(vw-WORLD*s)/2;ty=(vh-WORLD*s)/2;apply()}function zoomAt(f,cx,cy){const ns=clamp(s*f,.12,2.5),wx=(cx-tx)/s,wy=(cy-ty)/s;tx=cx-wx*ns;ty=cy-wy*ns;s=ns;apply()}function dist(){const a=[...pts.values()];return a.length<2?0:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}function mid(){const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}function svgEl(name,attrs){const e=doc.createElementNS('http://www.w3.org/2000/svg',name);for(const[k,val]of Object.entries(attrs))e.setAttribute(k,val);return e}function buildTerrain(){w.querySelectorAll('.v12').forEach(e=>e.remove());const old=w.querySelector('#v12terrain');if(old)old.remove();/* move temporary barns/farm pieces clear of interior mountain sweep */const barn=doc.querySelector('.barn'),farmshop=doc.querySelector('.farmshop');if(barn){barn.style.left='76%';barn.style.top='29%'}if(farmshop){farmshop.style.left='86%';farmshop.style.top='31%'}const animals=w.querySelector('.v10.animals');if(animals){animals.style.left='75%';animals.style.top='20%'}const svg=svgEl('svg',{id:'v12terrain',viewBox:'0 0 1000 1000',preserveAspectRatio:'none'});svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none';const defs=svgEl('defs',{});const g1=svgEl('linearGradient',{id:'backM',x1:'0',y1:'0',x2:'0',y2:'1'});g1.append(svgEl('stop',{offset:'0','stop-color':'#dce7e8'}),svgEl('stop',{offset:'.28','stop-color':'#87999c'}),svgEl('stop',{offset:'.62','stop-color':'#536b6b'}),svgEl('stop',{offset:'1','stop-color':'#324f48'}));const g2=svgEl('linearGradient',{id:'lowM',x1:'0',y1:'0',x2:'0',y2:'1'});g2.append(svgEl('stop',{offset:'0','stop-color':'#cfdadb'}),svgEl('stop',{offset:'.34','stop-color':'#7f9690'}),svgEl('stop',{offset:'.72','stop-color':'#4e7061'}),svgEl('stop',{offset:'1','stop-color':'#385848'}));defs.append(g1,g2);svg.append(defs);/* tall impassable rear range, right to ocean, tapering at coast */const back=svgEl('path',{d:'M95 145 L125 105 L150 132 L180 72 L210 125 L245 58 L275 118 L310 42 L345 112 L380 55 L415 120 L455 38 L490 110 L525 48 L560 122 L600 54 L635 114 L675 43 L710 116 L748 62 L785 124 L820 76 L855 130 L890 94 L925 142 L965 120 L1000 150 L1000 255 L95 255 Z',fill:'url(#backM)',stroke:'#42595b','stroke-width':'5'});svg.append(back);/* tree belt at base */const trees=svgEl('path',{d:'M105 238 C170 210 225 242 290 218 C350 196 420 240 485 214 C550 190 620 235 690 212 C760 190 835 232 930 205 L970 270 L100 270 Z',fill:'#31594a',opacity:'.78'});svg.append(trees);/* lower interior range: starts upper right, comes forward through old barns, broad U, returns and tapers toward ocean */const low=svgEl('path',{d:'M930 245 C865 255 805 270 755 305 C700 345 665 405 650 470 C635 535 590 570 520 565 C450 560 395 520 365 465 C335 410 300 380 250 390 C205 400 175 440 155 485 C135 530 110 560 72 575 L48 548 C80 520 92 475 112 430 C135 378 175 338 230 326 C295 312 350 345 390 405 C425 458 465 490 520 492 C570 494 595 465 607 418 C623 355 665 298 720 265 C780 228 850 210 930 205 Z',fill:'url(#lowM)',stroke:'#526d67','stroke-width':'5',opacity:'.97'});svg.append(low);/* snow/highlight ridges */const ridge=svgEl('path',{d:'M930 222 C845 228 780 250 725 285 C665 325 635 390 620 450 M370 430 C330 365 280 340 225 354 C170 368 145 430 120 495',fill:'none',stroke:'#dce9e8','stroke-width':'10','stroke-linecap':'round',opacity:'.7'});svg.append(ridge);w.appendChild(svg);/* OSKO valley marker */const valley=doc.createElement('div');valley.className='v12';valley.style.cssText='position:absolute;left:39%;top:12%;width:300px;height:125px;z-index:8;border:5px dashed #315c66;border-radius:45%;background:#cce4e255;color:#234d55;text-align:center;padding-top:38px;font-weight:bold;font-size:13px;pointer-events:none';valley.innerHTML='OSKO ICE CRYSTALS VALLEY<br><small style="font-weight:normal">commerce / books / merchandise — test space</small>';w.appendChild(valley);/* relocated ranch marker */const ranch=doc.createElement('div');ranch.className='v12';ranch.style.cssText='position:absolute;left:77%;top:25%;width:270px;height:150px;z-index:14;border:6px double #70502f;border-radius:22px;background:#c7d9a888;color:#33481d;text-align:center;padding-top:38px;font-weight:bold;font-size:12px;pointer-events:none';ranch.innerHTML='🐄 🐎 FARM / RANCH<br><small style="font-weight:normal">foothill side — temporary</small>';w.appendChild(ranch);/* coastline taper note */const coast=doc.createElement('div');coast.className='v12';coast.style.cssText='position:absolute;left:1%;top:47%;width:170px;height:90px;z-index:14;border:4px dashed #27778a;border-radius:18px;background:#c7edf066;color:#174d59;text-align:center;padding-top:22px;font-weight:bold;font-size:10px;pointer-events:none';coast.innerHTML='COAST FLEX AREA<br>mountains taper to water';w.appendChild(coast)}function setup(){doc=frame.contentDocument;v=doc.getElementById('v');w=doc.getElementById('w');if(!v||!w)return;const badge=doc.querySelector('.badge'),tip=doc.querySelector('.tip'),controls=doc.querySelector('.controls');if(badge)badge.style.display='none';if(tip)tip.style.display='none';if(controls)controls.style.display='none';buildTerrain();v.style.touchAction='none';v.onpointerdown=v.onpointermove=v.onpointerup=v.onpointercancel=null;v.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{v.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)dragStart={x:e.clientX,y:e.clientY,tx,ty};else if(pts.size===2){pinchStart={d:dist(),s,tx,ty,m:mid()};dragStart=null}},{passive:false});v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&dragStart){tx=dragStart.tx+e.clientX-dragStart.x;ty=dragStart.ty+e.clientY-dragStart.y;apply()}else if(pts.size===2&&pinchStart){const d=dist();if(!pinchStart.d)return;const m=mid(),ns=clamp(pinchStart.s*(d/pinchStart.d),.12,2.5),wx=(pinchStart.m.x-pinchStart.tx)/pinchStart.s,wy=(pinchStart.m.y-pinchStart.ty)/pinchStart.s;s=ns;tx=m.x-wx*s;ty=m.y-wy*s;apply()}},{passive:false});const end=e=>{pts.delete(e.pointerId);if(pts.size===1){const a=[...pts.values()][0];dragStart={x:a.x,y:a.y,tx,ty};pinchStart=null}else if(!pts.size){dragStart=null;pinchStart=null}};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);fit()}frame.addEventListener('load',setup);minus.onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);plus.onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);reset.onclick=fit;})();</script></body></html>
